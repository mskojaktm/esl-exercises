<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Short E Word Search</title>
<style>
body{font-family:system-ui,Arial,sans-serif;margin:0;padding:16px;background:#f6f7fb;color:#1f2937}
h1{font-size:1.5rem;text-align:center;margin:4px 0}.sub{text-align:center;color:#475569;margin:0 0 14px}
.wrap{max-width:1150px;margin:auto;display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:flex-start}
#gw{position:relative;user-select:none;-webkit-user-select:none;touch-action:none}
#ws{display:grid;gap:4px;position:relative;z-index:2}
.c{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;background:#fff;border:2px solid #cbd5e1;border-radius:6px;cursor:pointer;box-sizing:border-box;color:#1f2937}
.c.sel{background:#fde68a;border-color:#f59e0b}.c.start{background:#fde68a;border-color:#f59e0b;box-shadow:0 0 0 2px #f59e0b inset}
.c.bad{background:#fbd0d0;border-color:#ef4444}.c.hint{box-shadow:0 0 0 3px #2563eb inset;color:#1d4ed8}
#ov{position:absolute;inset:0;z-index:3;pointer-events:none}
.cap{position:absolute;border-radius:22px;border:3px solid;box-sizing:border-box}
.btns{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;padding:8px 14px;border-radius:8px;border:2px solid #334155;background:#fff;color:#1f2937;cursor:pointer}button:hover{background:#e2e8f0}
button:disabled{opacity:.5;cursor:not-allowed;background:#fff}
.hc{display:inline-block;min-width:1.5em;margin-left:6px;padding:0 6px;border-radius:999px;background:#2563eb;color:#fff;font-weight:700;font-size:.9em}button:disabled .hc{background:#94a3b8}
#msg{margin-top:10px;font-weight:700;min-height:1.4em;max-width:380px}
.pics{flex:1;min-width:300px;max-width:600px;display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.pc{background:#fff;border:2px solid #cbd5e1;border-radius:12px;padding:6px;text-align:center;cursor:pointer;position:relative}
.pc svg{width:110px;height:101px}.pc.on{border-color:#f59e0b;background:#fffbeb}
.pc.done{border-color:#16a34a;background:#f0fdf4;cursor:default}
.pc .wd{display:block;height:1.3em;font-weight:700;letter-spacing:2px;color:#15803d;font-size:16px}
.pc .tk{position:absolute;top:4px;right:8px;color:#16a34a;font-weight:700;font-size:18px;display:none}.pc.done .tk{display:block}
</style></head><body>

<div><div id="gw"><div id="ws"></div><div id="ov"></div></div>
<div class="btns"><button id="hint"></button><button id="rst">Start again</button></div>
<div id="msg"></div></div>
<div class="pics" id="pics"></div>
</div>

ea5e9\"/></svg>"],N=G.length,PITCH=48,COLS=['#ef4444','#f59e0b','#22c55e','#06b6d4','#8b5cf6','#ec4899','#14b8a6','#f97316','#84cc16','#6366f1','#e11d48','#0ea5e9'];
const ws=document.getElementById('ws'),ov=document.getElementById('ov'),msg=document.getElementById('msg'),hb=document.getElementById('hint');
ws.style.gridTemplateColumns=`repeat(${N},44px)`;
const cellEl={};
for(let r=0;r<N;r++)for(let c=0;c<N;c++){const d=document.createElement('div');d.className='c';d.textContent=G[r][c];d.dataset.r=r;d.dataset.c=c;ws.appendChild(d);cellEl[r+','+c]=d}
const key=a=>a.map(x=>x[0]+','+x[1]).sort().join('|');

const found=new Set(),hinted={};let sel=null,start=null,drag=false,last=null,hintsUsed=0;

function hbUpd(){const l=HMAX-hintsUsed;hb.innerHTML='💡 Hint<span class="hc">'+l+'</span>';hb.disabled=l<=0}hbUpd();
// picture cards (shuffled order so they don't follow the grid)
const order=W.map((_,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
order.forEach(i=>{const el=document.createElement('div');el.className='pc';el.id='pc'+i;
 el.innerHTML=`<span class="tk">✓</span>${SV[i]}<span class="wd"></span>`;
 el.onclick=()=>{if(found.has(i))return;sel=sel===i?null:i;document.querySelectorAll('.pc.on').forEach(x=>x.classList.remove('on'));if(sel!==null)el.classList.add('on')};
 document.getElementById('pics').appendChild(el)});
function cellOf(t){const d=t&&t.closest?t.closest('.c'):null;return d?[+d.dataset.r,+d.dataset.c]:null}
function line(a,b){const out=[];if(a[0]===b[0]){const s=Math.sign(b[1]-a[1]);for(let c=a[1];;c+=s){out.push([a[0],c]);if(c===b[1])break}}
 else if(a[1]===b[1]){const s=Math.sign(b[0]-a[0]);for(let r=a[0];;r+=s){out.push([r,a[1]]);if(r===b[0])break}}else return null;return out}
function clearSel(){document.querySelectorAll('.c.sel,.c.start').forEach(x=>x.classList.remove('sel','start'))}

function cap(i){const cs=W[i].cells,r0=Math.min(...cs.map(x=>x[0])),r1=Math.max(...cs.map(x=>x[0])),c0=Math.min(...cs.map(x=>x[1])),c1=Math.max(...cs.map(x=>x[1]));
 const d=document.createElement('div');d.className='cap';const col=COLS[i%COLS.length];
 Object.assign(d.style,{left:(c0*PITCH-2)+'px',top:(r0*PITCH-2)+'px',width:((c1-c0)*PITCH+48)+'px',height:((r1-r0)*PITCH+48)+'px',borderColor:col,background:col+'33'});ov.appendChild(d)}
function finish(a,b){clearSel();const l=line(a,b);
 if(l&&l.length>1&&l[1][0]<l[0][0]){flash(l);msg.textContent='Words go → , ← or ↓ (not up).';return}

function flash(l){l.forEach(x=>{const e=cellEl[x[0]+','+x[1]];e.classList.add('bad');setTimeout(()=>e.classList.remove('bad'),600)})}

ws.addEventListener('pointerdown',e=>{const c=cellOf(e.target);if(!c)return;e.preventDefault();
 if(start&&!drag&&!same(start,c)){const s=start;start=null;finish(s,c);return}

 const s=start;start=null;finish(s,last)});
hb.onclick=()=>{if(hintsUsed>=HMAX){msg.textContent='No hints left.';return}
 if(sel===null){msg.textContent='Click a picture first, then press Hint.';return}
 const w=W[sel],n=hinted[sel]||0;

document.getElementById('rst').onclick=()=>{found.clear();ov.innerHTML='';start=null;sel=null;clearSel();
 for(const k in hinted)delete hinted[k];document.querySelectorAll('.c.hint').forEach(x=>x.classList.remove('hint'));
 document.querySelectorAll('.pc').forEach(x=>{x.classList.remove('done','on');x.querySelector('.wd').textContent=''});msg.textContent=''};
</script></body></html>
