const same=(a,b)=>a&&b&&a[0]===b[0]&&a[1]===b[1];
ws.addEventListener('pointerdown',e=>{if(over)return;const c=cellOf(e.target);if(!c)return;e.preventDefault();
 if(start&&!drag&&!same(start,c)){const s=start;start=null;finish(s,c);return}
 start=c;last=c;drag=true;preview(c,c)});
window.addEventListener('pointermove',e=>{if(!drag)return;const c=cellOf(document.elementFromPoint(e.clientX,e.clientY));if(c){last=c;preview(start,c)}});
window.addEventListener('pointerup',()=>{if(!drag)return;drag=false;
 if(same(start,last)){clearSel();cellEl[start[0]+','+start[1]].classList.add('start');msg.textContent='Now click the last letter of the word.';return}
 const s=start;start=null;finish(s,last)});
hb.onclick=()=>{if(over)return;if(hintsUsed>=HMAX){msg.textContent='No hints left.';return}
 if(sel===null){msg.textContent='Click a picture first, then press Hint.';return}
 const w=W[sel],n=hinted[sel]||0;
 if(n>=w.w.length){msg.textContent='All the letters of this word are already shown.';return}
 const x=w.cells[n];cellEl[x[0]+','+x[1]].classList.add('hint');hinted[sel]=n+1;hintsUsed++;hbUpd();
 msg.textContent='Hint: letter '+(n+1)+' of '+w.w.length+' is marked in blue.'+(hintsUsed>=HMAX?' That was your last hint.':'')};
document.getElementById('rst').onclick=()=>{found.clear();miss=0;over=false;lvUpd();hbUpd();ov.innerHTML='';start=null;sel=null;clearSel();
 for(const k in hinted)delete hinted[k];document.querySelectorAll('.c.hint').forEach(x=>x.classList.remove('hint'));
 document.querySelectorAll('.pc').forEach(x=>{x.classList.remove('done','on');x.querySelector('.wd').textContent=''});msg.textContent=''};
</script></body></html>
