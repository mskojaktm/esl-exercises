<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Picture Crossword</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:16px;background:#f6f4ee;color:#222}
h1{text-align:center;margin:4px 0 2px}h2{text-align:center;margin:28px 0 10px}p.s{text-align:center;margin:0 0 14px;color:#555}
.wrap{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:flex-start}
table{border-collapse:collapse}td{width:40px;height:40px;padding:0;position:relative}
td.b{background:none}td.c{background:#fff;border:1.5px solid #333}
td .n{position:absolute;top:1px;left:3px;font-size:10px;font-weight:700;color:#444;pointer-events:none}
td input{width:100%;height:100%;box-sizing:border-box;border:0;background:transparent;text-align:center;font:700 22px system-ui;text-transform:uppercase;padding:6px 0 0;outline:0;cursor:pointer}
td.hl{background:#fff3b0}td.cur{background:#ffd54a}td.good{background:#c8f0c8}td.bad{background:#f8c9c9}
.clues{display:flex;gap:20px;flex-wrap:wrap}.clues h3{margin:0 0 6px}
.cl{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #ddd;border-radius:8px;padding:4px 8px;margin-bottom:6px;cursor:pointer}
.cl.on{border-color:#e6a800;background:#fff8dc}.cl b{min-width:20px}.cl svg,.cl .em{width:48px;height:48px;font-size:36px;line-height:48px;text-align:center}
.bar{text-align:center;margin-top:14px}button{font-size:15px;padding:8px 16px;margin:0 4px;border:0;border-radius:6px;background:#2f6fdb;color:#fff;cursor:pointer}
button.g{background:#777}div.msg{text-align:center;font-weight:700;color:#1b7a1b;height:24px;margin-top:8px}
</style></head><body>
<h1>Picture Crossword</h1><p class="s">Look at each picture and write the English word. Click a square twice to switch Across / Down.</p>
<div id="puz"></div>
<script>
function init(D,root){const key=(r,c)=>r+','+c,M={},g=root.querySelector('table');
D.entries.forEach((e,i)=>{for(let k=0;k<e.len;k++){const r=e.r+(e.dir=='D'?k:0),c=e.c+(e.dir=='A'?k:0),m=M[key(r,c)]??={r,c};m[e.dir]=i;m.ch=e.ans[k];if(k==0)m.num=e.n}});
for(let r=0;r<D.rows;r++){const tr=g.insertRow();for(let c=0;c<D.cols;c++){const td=tr.insertCell(),m=M[key(r,c)];if(!m){td.className='b';continue}td.className='c';m.td=td;
if(m.num)td.insertAdjacentHTML('beforeend','<span class="n">'+m.num+'</span>');
const i=document.createElement('input');i.maxLength=2;i.autocomplete='off';m.inp=i;td.appendChild(i);i.dataset.k=key(r,c);}}
let dir='A',cur=null;const clEls=[];
D.entries.forEach((e,i)=>{const d=document.createElement('div');d.className='cl';d.innerHTML='<b>'+e.n+'</b>'+e.img;d.onclick=()=>{dir=e.dir;go(key(e.r,e.c))};root.querySelector('.'+e.dir).appendChild(d);clEls[i]=d});
function cells(e){return Array.from({length:e.len},(_,k)=>M[key(e.r+(e.dir=='D'?k:0),e.c+(e.dir=='A'?k:0))])}
function hl(){Object.values(M).forEach(m=>m.td.classList.remove('hl','cur'));clEls.forEach(x=>x.classList.remove('on'));if(!cur)return;
const m=M[cur];if(m[dir]===undefined)dir=dir=='A'?'D':'A';const i=m[dir];cells(D.entries[i]).forEach(x=>x.td.classList.add('hl'));m.td.classList.add('cur');clEls[i].classList.add('on')}
function go(k){M[k].inp.focus();M[k].inp.select()}
function step(k,s){const m=M[k],e=D.entries[m[dir]];if(!e)return;const r=m.r+(dir=='D'?s:0),c=m.c+(dir=='A'?s:0);if(M[key(r,c)])go(key(r,c))}
g.addEventListener('focusin',ev=>{if(ev.target.dataset.k){cur=ev.target.dataset.k;hl()}});
g.addEventListener('click',ev=>{const k=ev.target.dataset.k;if(k&&k===window._last&&M[k].A!==undefined&&M[k].D!==undefined){dir=dir=='A'?'D':'A';hl()}window._last=k});
g.addEventListener('input',ev=>{const i=ev.target,k=i.dataset.k;if(!k)return;const v=(i.value.match(/[a-z]/gi)||[]).pop()||'';i.value=v.toUpperCase();i.parentNode.classList.remove('good','bad');if(v)step(k,1)});
g.addEventListener('keydown',ev=>{const k=ev.target.dataset.k;if(!k)return;const m=M[k];const mv={ArrowRight:[0,1],ArrowLeft:[0,-1],ArrowDown:[1,0],ArrowUp:[-1,0]}[ev.key];
if(mv){ev.preventDefault();dir=mv[0]?'D':'A';const n=M[key(m.r+mv[0],m.c+mv[1])];if(n)go(key(n.r,n.c));else hl()}
else if(ev.key=='Backspace'&&!m.inp.value){ev.preventDefault();step(k,-1)}});
const msg=root.querySelector('.msg');
root.querySelector('.chk').onclick=()=>{let ok=true;Object.values(M).forEach(m=>{const v=m.inp.value.toUpperCase();m.td.classList.remove('good','bad');if(v){m.td.classList.add(v==m.ch?'good':'bad')}if(v!=m.ch)ok=false});msg.textContent=ok?'🎉 Well done! All correct!':''};
root.querySelector('.rev').onclick=()=>Object.values(M).forEach(m=>{m.inp.value=m.ch;m.td.classList.remove('bad');m.td.classList.add('good')});
root.querySelector('.clr').onclick=()=>{Object.values(M).forEach(m=>{m.inp.value='';m.td.classList.remove('good','bad')});msg.textContent=''};
}
const P=[{"rows": 9, "cols": 11, "entries": [{"ans": "ANT", "r": 4, "c": 2, "dir": "A", "len": 3, "n": 9, "img": "<span class=\"em\">🐜</span>"}, {"ans": "PAD", "r": 3, "c": 2, "dir": "D", "len": 3, "n": 8, "img": "<span class=\"em\">🗒️</span>"}, {"ans": "MAP", "r": 3, "c": 0, "dir": "A", "len": 3, "n": 7, "img": "<span class=\"em\">🗺️</span>"}, {"ans": "DAD", "r": 5, "c": 0, "dir": "A", "len": 3, "n": 11, "img": "<span class=\"em\">👨‍👧</span>"}, {"ans": "YAM", "r": 1, "c": 0, "dir": "D", "len": 3, "n": 3, "img": "<span class=\"em\">🍠</span>"}, {"ans": "YAK", "r": 1, "c": 0, "dir": "A", "len": 3, "n": 3, "img": "<svg viewBox=\"0 0 64 64\"><rect x=\"22\" y=\"42\" width=\"5\" height=\"14\" fill=\"#3b2418\"/><rect x=\"42\" y=\"42\" width=\"5\" height=\"14\" fill=\"#3b2418\"/><ellipse cx=\"38\" cy=\"36\" rx=\"22\" ry=\"14\" fill=\"#5b3a29\"/><path d=\"M20 44H56L52 54H24Z\" fill=\"#3b2418\"/><ellipse cx=\"14\" cy=\"34\" rx=\"9\" ry=\"8\" fill=\"#6d4630\"/><path d=\"M8 28Q0 18 9 15M20 28Q28 18 19 15\" fill=\"none\" stroke=\"#eee\" stroke-width=\"3\"/><circle cx=\"11\" cy=\"33\" r=\"1.8\"/><ellipse cx=\"8\" cy=\"38\" rx=\"3\" ry=\"2\" fill=\"#c9a98f\"/></svg>"}, {"ans": "DAM", "r": 5, "c": 0, "dir": "D", "len": 3, "n": 11, "img": "<svg viewBox=\"0 0 64 64\"><rect x=\"0\" y=\"18\" width=\"26\" height=\"40\" fill=\"#4aa3df\"/><rect x=\"44\" y=\"48\" width=\"20\" height=\"10\" fill=\"#4aa3df\"/><path d=\"M24 12H42L48 58H18Z\" fill=\"#9a9a9a\" stroke=\"#555\" stroke-width=\"2\"/><path d=\"M26 28H40M24 40H43\" stroke=\"#777\" stroke-width=\"2\"/></svg>"}, {"ans": "RAT", "r": 2, "c": 4, "dir": "D", "len": 3, "n": 4, "img": "<span class=\"em\">🐀</span>"}, {"ans": "RAG", "r": 2, "c": 4, "dir": "A", "len": 3, "n": 4, "img": "<svg viewBox=\"0 0 64 64\"><path d=\"M10 18Q32 8 54 18L50 34L54 52L42 46L32 54L22 46L10 52L14 34Z\" fill=\"#9fb8d1\" stroke=\"#456\" stroke-width=\"2\"/><path d=\"M18 26Q32 20 46 26M18 36Q32 30 46 36\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\"/></svg>"}, {"ans": "MAT", "r": 7, "c": 0, "dir": "A", "len": 3, "n": 13, "img": "<svg viewBox=\"0 0 64 64\"><rect x=\"8\" y=\"22\" width=\"48\" height=\"26\" rx=\"3\" fill=\"#b5651d\" stroke=\"#6b3a0e\" stroke-width=\"2\"/><rect x=\"14\" y=\"28\" width=\"36\" height=\"14\" fill=\"none\" stroke=\"#f3d9a4\" stroke-width=\"2\" stroke-dasharray=\"3 2\"/></svg>"}, {"ans": "AX", "r": 7, "c": 1, "dir": "D", "len": 2, "n": 14, "img": "<span class=\"em\">🪓</span>"}, {"ans": "BAG", "r": 0, "c": 6, "dir": "D", "len": 3, "n": 1, "img": "<span class=\"em\">👜</span>"}, {"ans": "BAT", "r": 0, "c": 6, "dir": "A", "len": 3, "n": 1, "img": "<span class=\"em\">🦇</span>"}, {"ans": "TAP", "r": 0, "c": 8, "dir": "D", "len": 3, "n": 2, "img": "<span class=\"em\">🚰</span>"}, {"ans": "PAN", "r": 2, "c": 8, "dir": "A", "len": 3, "n": 5, "img": "<svg viewBox=\"0 0 64 64\"><circle cx=\"26\" cy=\"34\" r=\"20\" fill=\"#444\"/><circle cx=\"26\" cy=\"34\" r=\"15\" fill=\"#777\"/><rect x=\"43\" y=\"31\" width=\"20\" height=\"6\" rx=\"3\" fill=\"#8a5a2b\"/></svg>"}, {"ans": "NAP", "r": 2, "c": 10, "dir": "D", "len": 3, "n": 6, "img": "<span class=\"em\">🛌</span>"}, {"ans": "CAP", "r": 4, "c": 8, "dir": "A", "len": 3, "n": 10, "img": "<span class=\"em\">🧢</span>"}, {"ans": "CAT", "r": 4, "c": 8, "dir": "D", "len": 3, "n": 10, "img": "<span class=\"em\">🐈</span>"}, {"ans": "HAT", "r": 6, "c": 6, "dir": "A", "len": 3, "n": 12, "img": "<span class=\"em\">🎩</span>"}]}, {"rows": 7, "cols": 4, "entries": [{"ans": "JAM", "r": 2, "c": 0, "dir": "A", "len": 3, "n": 3, "img": "<svg viewBox=\"0 0 64 64\"><rect x=\"16\" y=\"24\" width=\"32\" height=\"30\" rx=\"6\" fill=\"#b0173a\"/><rect x=\"14\" y=\"17\" width=\"36\" height=\"9\" rx=\"2\" fill=\"#ddd\" stroke=\"#888\" stroke-width=\"2\"/><rect x=\"21\" y=\"33\" width=\"22\" height=\"14\" rx=\"2\" fill=\"#fff\"/><circle cx=\"32\" cy=\"40\" r=\"4\" fill=\"#b0173a\"/></svg>"}, {"ans": "ANT", "r": 2, "c": 1, "dir": "D", "len": 3, "n": 4, "img": "<span class=\"em\">🐜</span>"}, {"ans": "DAM", "r": 0, "c": 2, "dir": "D", "len": 3, "n": 2, "img": "<svg viewBox=\"0 0 64 64\"><rect x=\"0\" y=\"18\" width=\"26\" height=\"40\" fill=\"#4aa3df\"/><rect x=\"44\" y=\"48\" width=\"20\" height=\"10\" fill=\"#4aa3df\"/><path d=\"M24 12H42L48 58H18Z\" fill=\"#9a9a9a\" stroke=\"#555\" stroke-width=\"2\"/><path d=\"M26 28H40M24 40H43\" stroke=\"#777\" stroke-width=\"2\"/></svg>"}, {"ans": "TAP", "r": 4, "c": 1, "dir": "A", "len": 3, "n": 5, "img": "<span class=\"em\">🚰</span>"}, {"ans": "PAN", "r": 4, "c": 3, "dir": "D", "len": 3, "n": 6, "img": "<svg viewBox=\"0 0 64 64\"><circle cx=\"26\" cy=\"34\" r=\"20\" fill=\"#444\"/><circle cx=\"26\" cy=\"34\" r=\"15\" fill=\"#777\"/><rect x=\"43\" y=\"31\" width=\"20\" height=\"6\" rx=\"3\" fill=\"#8a5a2b\"/></svg>"}, {"ans": "FAN", "r": 6, "c": 1, "dir": "A", "len": 3, "n": 7, "img": "<svg viewBox=\"0 0 64 64\"><circle cx=\"32\" cy=\"28\" r=\"21\" fill=\"none\" stroke=\"#555\" stroke-width=\"3\"/><ellipse cx=\"32\" cy=\"17\" rx=\"5\" ry=\"9\" fill=\"#4aa3df\" transform=\"rotate(0 32 28)\"/><ellipse cx=\"32\" cy=\"17\" rx=\"5\" ry=\"9\" fill=\"#4aa3df\" transform=\"rotate(120 32 28)\"/><ellipse cx=\"32\" cy=\"17\" rx=\"5\" ry=\"9\" fill=\"#4aa3df\" transform=\"rotate(240 32 28)\"/><circle cx=\"32\" cy=\"28\" r=\"4\" fill=\"#333\"/><rect x=\"30\" y=\"49\" width=\"4\" height=\"8\" fill=\"#555\"/><rect x=\"20\" y=\"56\" width=\"24\" height=\"5\" rx=\"2\" fill=\"#555\"/></svg>"}, {"ans": "PAD", "r": 0, "c": 0, "dir": "A", "len": 3, "n": 1, "img": "<span class=\"em\">🗒️</span>"}]}];
P.forEach((D,i)=>{const s=document.createElement('section');s.innerHTML='<h2>Puzzle '+(i+1)+'</h2><div class="wrap"><table></table><div class="clues"><div><h3>Across →</h3><div class="A"></div></div><div><h3>Down ↓</h3><div class="D"></div></div></div></div><div class="bar"><button class="chk">Check</button><button class="rev g">Show answers</button><button class="clr g">Clear</button></div><div class="msg"></div>';document.getElementById('puz').appendChild(s);init(D,s)});
</script></body></html>
