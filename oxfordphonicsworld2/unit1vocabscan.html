<title>Short A Word Search</title>
<style>
body{font-family:system-ui,Arial,sans-serif;margin:0;padding:16px;background:#f6f7fb;color:#1f2937}

.wrap{max-width:1150px;margin:auto;display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:flex-start}
#gw{position:relative;user-select:none;-webkit-user-select:none;touch-action:none}
#ws{display:grid;gap:4px;position:relative;z-index:2}
.c{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;background:#fff;border:2px solid #cbd5e1;border-radius:6px;cursor:pointer;box-sizing:border-box;color:#1f2937}
.c.sel{background:#fde68a;border-color:#f59e0b}.c.start{background:#fde68a;border-color:#f59e0b;box-shadow:0 0 0 2px #f59e0b inset}
.c.bad{background:#fbd0d0;border-color:#ef4444}.c.hint{box-shadow:0 0 0 3px #2563eb inset;color:#1d4ed8}
#ov{position:absolute;inset:0;z-index:3;pointer-events:none}
.cap{position:absolute;border-radius:22px;border:3px solid;box-sizing:border-box}
.btns{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;padding:8px 14px;border-radius:8px;border:2px solid #334155;background:#fff;color:#1f2937;cursor:pointer}button:hover{background:#e2e8f0}
button:disabled{opacity:.5;cursor:not-allowed;background:#fff}
.hc{display:inline-block;min-width:1.5em;margin-left:6px;padding:0 6px;border-radius:999px;background:#2563eb;color:#fff;font-weight:700;font-size:.9em}button:disabled .hc{background:#94a3b8}
#msg{margin-top:10px;font-weight:700;min-height:1.4em;max-width:380px}
.pics{flex:1;min-width:300px;max-width:600px;display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.pc{background:#fff;border:2px solid #cbd5e1;border-radius:12px;padding:6px;text-align:center;cursor:pointer;position:relative}
.pc svg{width:110px;height:101px}.pc.on{border-color:#f59e0b;background:#fffbeb}
.pc.done{border-color:#16a34a;background:#f0fdf4;cursor:default}
.pc .wd{display:block;height:1.3em;font-weight:700;letter-spacing:2px;color:#15803d;font-size:16px}
.pc .tk{position:absolute;top:4px;right:8px;color:#16a34a;font-weight:700;font-size:18px;display:none}.pc.done .tk{display:block}
</style></head><body>
