<style>
:root{--teal:#028090;--navy:#0D2B35;--bg:#f2f7f8;--card:#fff;--text:#1d2b30;--line:#d5e3e6;--ok:#1b7f4b;--okbg:#e5f5ec;--bad:#b3261e;--badbg:#fdeceb;--ex:#eef4f5}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Calibri,'Open Sans',sans-serif;font-size:17px;line-height:1.65;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
header{background:var(--navy);color:#fff;padding:26px 16px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:2px solid var(--teal);padding:8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}

.ctl{font:inherit;font-size:.88rem;border:0;border-radius:6px;padding:6px 13px;cursor:pointer;background:var(--teal);color:#fff}
.ctl.alt{background:transparent;color:var(--teal);border:1.5px solid var(--teal)}
.ctl.on{background:var(--navy);color:#fff;border-color:var(--navy)}
main{max-width:760px;margin:0 auto;padding:18px 14px 50px}
.card{background:var(--card);border-left:6px solid var(--teal);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1);padding:16px 18px;margin-bottom:18px}
.sh{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.sh h2{font-size:1.05rem;margin:0;font-weight:600}
.badge{flex:none;background:var(--teal);color:#fff;font-family:'Trebuchet MS',sans-serif;font-weight:700;border-radius:50%;width:28px;height:28px;text-align:center;line-height:28px}
audio{width:100%;margin:2px 0 8px}
.prow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.prow span{font-size:.9rem;opacity:.8}
table{width:100%;border-collapse:collapse;margin-top:14px;border:1.5px solid var(--line)}
th{background:var(--navy);color:#fff;font-family:'Trebuchet MS',sans-serif;font-size:1.25rem;padding:6px;width:50%}
td{padding:8px 14px;border-top:1px solid var(--line);font-size:1.05rem}
td+td,th+th{border-left:1.5px solid var(--line)}
.q{display:flex;align-items:center;gap:10px;padding:8px 10px;border:2px solid var(--line);border-radius:8px;margin-bottom:8px}
.q.ok{border-color:var(--ok);background:var(--okbg)}.q.bad{border-color:var(--bad);background:var(--badbg)}
.n{font-family:'Trebuchet MS',sans-serif;font-weight:700;color:var(--teal);min-width:1.4em}
.wd{font-size:1.1rem;font-weight:600;min-width:5.5em}
.opt{font:inherit;font-size:1rem;padding:3px 16px;border:2px solid var(--line);border-radius:18px;background:var(--card);color:var(--text);cursor:pointer}
.opt:hover{border-color:var(--teal)}.opt.sel{background:var(--teal);border-color:var(--teal);color:#fff}
.fb{margin-left:auto;font-size:.88rem;font-weight:600}.q.ok .fb{color:var(--ok)}.q.bad .fb{color:var(--bad)}
.hint{margin:0 0 12px;font-size:.92rem;opacity:.85}
.cr{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
@media (max-width:520px){.card{padding:14px 11px}.wd{min-width:4.2em}.q{flex-wrap:wrap}}

 d.appendChild(r.fb);qs.appendChild(d);rows.push(r)});
function paint(r){r.d.className='q';r.fb.textContent='';r.btns.forEach(([b,s])=>b.classList.toggle('sel',r.sel===s))}
function check(){let ok=0;rows.forEach(r=>{if(!r.sel){paint(r);return}const g=r.sel===r.a;if(g)ok++;r.d.className='q '+(g?'ok':'bad');r.fb.textContent=g?'✓ Correct':'✗ Try again'});
 document.getElementById('tot').textContent='Score: '+ok+' / '+rows.length}
document.getElementById('gc').onclick=check;
document.getElementById('gs').onclick=()=>{rows.forEach(r=>{r.sel=r.a;paint(r)});check()};
document.getElementById('gr').onclick=()=>{rows.forEach(r=>{r.sel=null;paint(r)});document.getElementById('tot').textContent='Score: 0 / '+rows.length};
</script></body></html>
