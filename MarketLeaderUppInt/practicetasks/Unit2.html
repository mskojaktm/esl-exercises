<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 60px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Calibri,'Open Sans',sans-serif;font-size:17px;line-height:1.65;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
header{background:var(--navy);color:#fff;padding:26px 16px}
header h1{font-family:'Trebuchet MS',sans-serif;margin:0 auto;max-width:800px;font-size:1.7rem}
header p{max-width:800px;margin:4px auto 0;opacity:.85}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:2px solid var(--teal);padding:8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.score{font-family:'Trebuchet MS',sans-serif;font-weight:700;color:var(--teal);margin-right:auto}
.ctl{font:inherit;font-size:.88rem;border:0;border-radius:6px;padding:6px 13px;cursor:pointer;background:var(--teal);color:#fff}
.ctl.alt{background:transparent;color:var(--teal);border:1.5px solid var(--teal)}
main{max-width:800px;margin:0 auto;padding:10px 14px 50px}
.grp{font-family:'Trebuchet MS',sans-serif;color:var(--navy);margin:30px 0 10px;font-size:1.2rem;text-transform:uppercase;letter-spacing:.06em;border-bottom:2px solid var(--line)}
@media (prefers-color-scheme:dark){.grp{color:var(--text)}}
.card{background:var(--card);border-left:6px solid var(--teal);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1);padding:16px 18px;margin-bottom:18px}
.sh{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.sh h2{font-size:1.02rem;margin:0;font-weight:600}
.badge{flex:none;background:var(--teal);color:#fff;font-family:'Trebuchet MS',sans-serif;font-weight:700;border-radius:50%;width:28px;height:28px;text-align:center;line-height:28px}
.sc{margin-left:auto;font-weight:700;color:var(--teal);white-space:nowrap}
.cr{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.q{display:flex;gap:10px;margin-bottom:12px}
.q .n{font-family:'Trebuchet MS',sans-serif;font-weight:700;color:var(--teal);min-width:1.4em}
.q.ex{background:var(--ex);border-radius:8px;padding:8px 10px}
.exw{color:var(--teal);border-bottom:2px solid var(--teal)}
input[type=text],textarea{font:inherit;padding:2px 8px;border:0;border-bottom:2px solid var(--teal);background:var(--ex);color:var(--text);border-radius:4px 4px 0 0;max-width:100%}
input[type=text]{width:9em;text-align:center}input.ph{width:20em}
textarea{width:100%;border:2px solid var(--line);border-radius:6px;min-height:3.4em;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--teal)}
.ok{border-color:var(--ok)!important}.bad{border-color:var(--bad)!important}
input.ok,textarea.ok{background:var(--okbg);color:var(--ok)}input.bad,textarea.bad{background:var(--badbg);color:var(--bad)}
.fb{display:block;font-size:.88rem;margin-top:2px}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.opt{font:inherit;font-size:.95rem;padding:3px 12px;border:2px solid var(--line);border-radius:18px;background:var(--card);color:var(--text);cursor:pointer}
.opt:hover{border-color:var(--teal)}.opt.sel{background:var(--teal);border-color:var(--teal);color:#fff}
.opt.ok{background:var(--okbg);color:var(--ok)}.opt.bad{background:var(--badbg);color:var(--bad);text-decoration:line-through}
.gap{white-space:nowrap}
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.list{display:flex;flex-direction:column;gap:7px}
.w{font:inherit;display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 10px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;min-height:42px;line-height:1.3}
.w:hover:not(:disabled){border-color:var(--teal)}
.w .lab{font-family:'Trebuchet MS',sans-serif;font-weight:700;color:var(--teal);min-width:1.1em}
.w .tx{flex:1}
.w.sel{border-color:var(--teal);box-shadow:0 0 0 3px rgba(2,128,144,.35);font-weight:600}
.w.pr{background:hsl(var(--h) 60% var(--pl));border-color:hsl(var(--h) 55% 45%)}
.w.ok{box-shadow:inset 0 0 0 1px var(--ok)}.w.bad{box-shadow:inset 0 0 0 1px var(--bad)}
.tag{font-family:'Trebuchet MS',sans-serif;font-size:.78rem;font-weight:700;min-width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;background:hsl(var(--h) 55% 38%);color:#fff}
.slots,.pool{display:flex;flex-wrap:wrap;gap:6px;min-height:40px}
.slots{border-bottom:2px solid var(--teal);padding:2px 0 4px;margin:4px 0 6px}
.slots.ok{background:var(--okbg)}.slots.bad{background:var(--badbg)}
.tile{font:inherit;padding:2px 11px;border:2px solid var(--line);border-radius:8px;background:var(--ex);color:var(--text);cursor:pointer}
.tile:hover{border-color:var(--teal)}.tile.used{visibility:hidden}
.ex-s{border:2px solid var(--line);border-radius:8px;padding:8px 12px;margin:0 0 8px;background:var(--ex)}
.cx{display:block;width:100%;text-align:left;font:inherit;padding:8px 12px;margin-bottom:8px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
.cx.on{text-decoration:line-through;opacity:.6;background:var(--ex)}
.tk{display:flex;gap:10px;align-items:flex-start;padding:6px 10px;margin-bottom:6px;border:2px solid var(--line);border-radius:8px;cursor:pointer}
.tk input{margin-top:.45em;width:1.1em;height:1.1em;accent-color:var(--teal)}
.tk.ex{background:var(--ex);cursor:default}
.note{font-size:.88rem;opacity:.8;margin:8px 0 0}
.cw{display:inline-block;vertical-align:middle;text-align:center;margin:2px 8px;padding:2px 10px;border:1px solid var(--line);border-radius:6px;line-height:1.3;background:var(--ex)}
select.gs{font:inherit;font-size:.95rem;max-width:100%;padding:2px 6px;border:0;border-bottom:2px solid var(--teal);background:var(--ex);color:var(--text);border-radius:4px 4px 0 0}
select.gs.ok{background:var(--okbg);color:var(--ok)}select.gs.bad{background:var(--badbg);color:var(--bad)}select.gs:disabled,input.exg{opacity:1;color:var(--teal);font-weight:600;-webkit-text-fill-color:var(--teal)}
sup{color:var(--teal);font-weight:700;font-size:.7em}.cl{margin:0 0 12px}
.letter{border:2px solid var(--line);border-radius:8px;padding:14px 18px;background:var(--ex)}.letter h3{font-family:'Trebuchet MS',sans-serif;font-size:1rem;margin:0 0 6px}
.vb{display:inline-block;border:1.5px solid var(--teal);border-radius:6px;padding:3px 14px;margin:0 0 10px}
.ln{align-items:center}.lt{flex:1}.lc{display:flex;gap:6px;align-items:center;flex:none}.lc input[type=text]{width:7.5em}
.chk{list-style:none;padding:0;margin:8px 0}.chk li{padding:2px 0}.chk li.ok{color:var(--ok)}.chk li.bad{color:var(--bad)}
.em label{display:block;margin:6px 0 2px;font-weight:600}.em input[type=text]{width:100%;text-align:left}.em textarea{min-height:12em}
.hint{margin:0 0 10px;font-size:.92rem;opacity:.88}.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
@media (max-width:520px){.card{padding:14px 11px}.lc{flex-wrap:wrap}.boxes{gap:8px}.w{padding:5px 7px;font-size:.93rem}input.ph{width:100%}}
</style></head><body>
<header><h1>UNIT 2 — International Marketing</h1><p>Language work: vocabulary, noun phrases, linking ideas and a marketing letter. Do each exercise, then press Check.</p></header>
<div class="bar"><span class="score" id="tot">Score: 0 / 0</span>
<button class="ctl" id="gc">Check All</button><button class="ctl alt" id="gs">Show Answers</button><button class="ctl alt" id="gr">Reset All</button></div>
<main id="main"></main>
<script>
const $=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const N=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/-/g,' ').replace(/[.!?]+$/,'').replace(/\s+/g,' ').trim();
const LET='abcdefghij';

/* ---------- engines ---------- */
function fill(body,items){
 const rows=[];
 items.forEach((it,i)=>{
  const r=$('div','q'+(it.ex?' ex':'')),d=$('div'),ins=[];
  const A=it.ex?null:(Array.isArray(it.a[0])?it.a:[it.a]);
  it.t.split('[]').forEach((p,k,arr)=>{d.insertAdjacentHTML('beforeend',p);
   if(k<arr.length-1){if(it.ex)d.insertAdjacentHTML('beforeend','<b class="exw">'+it.ex+'</b>');
    else{const x=$('input');x.type='text';x.autocomplete='off';x.spellcheck=false;x.placeholder=(it.ph&&it.ph[k])||'';x.setAttribute('autocapitalize','off');
     x.className=A[k][0].includes(' ')?'ph':'';x.setAttribute('aria-label','answer '+(i+1));ins.push(x);d.appendChild(x)}}});
  const fb=$('span','fb');d.appendChild(fb);
  r.append($('span','n',i+1),d);body.appendChild(r);
  if(!it.ex)rows.push({ins,A,fb});
 });
 return{max:rows.length,
  check(){let ok=0;rows.forEach(r=>{let all=true,any=false;
    r.ins.forEach((x,k)=>{const v=N(x.value);if(v)any=true;const g=r.A[k].some(a=>N(a)===v);x.classList.remove('ok','bad');if(v)x.classList.add(g?'ok':'bad');if(!g)all=false});
    if(all){ok++;r.fb.className='fb ok';r.fb.textContent='✓ Correct'}
    else if(any){r.fb.className='fb bad';r.fb.textContent='✗ Not quite. Try again.'}else{r.fb.className='fb';r.fb.textContent=''}});return ok},
  show(){rows.forEach(r=>r.ins.forEach((x,k)=>x.value=r.A[k][0]))},
  reset(){rows.forEach(r=>{r.ins.forEach(x=>{x.value='';x.className=x.className.replace(/\b(ok|bad)\b/g,'').trim()});r.fb.textContent='';r.fb.className='fb'})}};
}
function choice(body,items,inline){
 const rows=[];
 items.forEach((it,i)=>{
  const r=$('div','q'+(it.ex?' ex':'')),d=$('div'),row={it,btns:[],sel:it.ex?it.a:null};
  const mk=()=>{const w=$('span',inline?'gap':'opts');it.o.forEach((v,k)=>{const b=$('button','opt',(inline?'':LET[k]+') ')+v);b.type='button';
    b.onclick=()=>{if(it.ex)return;row.sel=v;paint(row)};row.btns.push(b);w.appendChild(b)});return w};
  const parts=it.t.split('[]');d.insertAdjacentHTML('beforeend',parts[0]);
  if(inline){d.appendChild(mk())}else{d.insertAdjacentHTML('beforeend','<b>………</b>')}
  d.insertAdjacentHTML('beforeend',parts[1]||'');
  if(!inline)d.appendChild(mk());
  row.fb=$('span','fb');d.appendChild(row.fb);r.append($('span','n',i+1),d);body.appendChild(r);rows.push(row);paint(row);
 });
 function paint(r,chk){r.btns.forEach((b,k)=>{b.className='opt';if(r.it.o[k]===r.sel){b.classList.add(r.it.ex?'ok':chk?(r.sel===r.it.a?'ok':'bad'):'sel')}})}
 return{max:rows.filter(r=>!r.it.ex).length,
  check(){let ok=0;rows.forEach(r=>{if(r.it.ex)return;paint(r,true);const g=r.sel===r.it.a;if(g)ok++;
    r.fb.className='fb '+(r.sel?(g?'ok':'bad'):'');r.fb.textContent=r.sel?(g?'✓ Correct':'✗ Not quite. Try again.'):''});return ok},
  show(){rows.forEach(r=>{if(!r.it.ex){r.sel=r.it.a;paint(r)}})},
  reset(){rows.forEach(r=>{if(!r.it.ex){r.sel=null;paint(r);r.fb.textContent='';r.fb.className='fb'}})}};
}
function match(body,c){
 let pairs={},sel=null,chk=false;if(c.ex!=null)pairs[c.ex]=c.key[c.ex];
 const wrap=$('div','boxes'),LA=$('div','list'),LB=$('div','list'),fb=$('p','fb');wrap.append(LA,LB);body.append(wrap,fb);
 const left=r=>Object.keys(pairs).find(k=>pairs[k]===r);
 const H=i=>[190,28,285,140,340,55][i%6];
 function btn(side,i){const L=side==='L';const pi=L?(i in pairs?pairs[i]:null):(left(i)!=null?+left(i):null);
  const b=$('button','w');b.type='button';b.innerHTML='<span class="lab">'+(L?i+1:LET[i])+'</span><span class="tx">'+(L?c.L[i]:c.R[i])+'</span>';
  const li=L?i:pi;
  if(pi!=null){b.classList.add('pr');b.style.setProperty('--h',H(li));b.insertAdjacentHTML('beforeend','<span class="tag">'+(L?LET[pi]:+pi+1)+'</span>');
   if(chk)b.classList.add(c.key[li]===pairs[li]?'ok':'bad')}
  if(L&&sel===i)b.classList.add('sel');
  if(li===c.ex&&pi!=null){b.disabled=true}
  b.onclick=()=>{chk=false;fb.textContent='';
   if(L){if(sel===i)sel=null;else{delete pairs[i];sel=i}}
   else{const o=left(i);if(sel!=null){if(o!=null)delete pairs[o];pairs[sel]=i;sel=null}else if(o!=null)delete pairs[o]}
   rend()};return b}
 function rend(){LA.innerHTML='';LB.innerHTML='';c.L.forEach((_,i)=>LA.appendChild(btn('L',i)));c.R.forEach((_,i)=>LB.appendChild(btn('R',i)))}
 rend();
 return{max:c.L.length-(c.ex!=null?1:0),
  check(){chk=true;let ok=0,t=0;c.L.forEach((_,i)=>{if(i===c.ex||!(i in pairs))return;t++;if(pairs[i]===c.key[i])ok++});rend();
   fb.className='fb '+(t&&ok===t?'ok':'bad');fb.textContent=t?ok+' of '+t+' pairs correct'+(t<this.max?' ('+(this.max-t)+' still to match)':'')+'.':'';return ok},
  show(){pairs={};c.L.forEach((_,i)=>pairs[i]=c.key[i]);sel=null;rend()},
  reset(){pairs={};if(c.ex!=null)pairs[c.ex]=c.key[c.ex];sel=null;chk=false;fb.textContent='';rend()}};
}
function reorder(body,items){
 const rows=[];
 items.forEach((it,i)=>{
  const r=$('div','q'),d=$('div'),slots=$('div','slots'),pool=$('div','pool'),fb=$('span','fb');
  const st={placed:[]};d.style.flex='1';d.append(slots,pool,fb);r.append($('span','n',it.n||i+1),d);body.appendChild(r);
  const rend=(c)=>{slots.innerHTML='';pool.innerHTML='';slots.className='slots'+(c?(c==='ok'?' ok':' bad'):'');
   st.placed.forEach(k=>{const b=$('button','tile',it.w[k]);b.type='button';b.onclick=()=>{st.placed=st.placed.filter(x=>x!==k);fb.textContent='';rend()};slots.appendChild(b)});
   it.w.forEach((w,k)=>{const b=$('button','tile'+(st.placed.includes(k)?' used':''),w);b.type='button';b.onclick=()=>{st.placed.push(k);fb.textContent='';rend()};pool.appendChild(b)})};
  rows.push({it,st,rend,fb});rend();
 });
 return{max:rows.length,
  check(){let ok=0;rows.forEach(r=>{const s=r.st.placed.map(k=>r.it.w[k]).join(' ');const g=N(s)===N(r.it.a);if(g)ok++;
    r.rend(r.st.placed.length?(g?'ok':'bad'):'');r.fb.className='fb '+(r.st.placed.length?(g?'ok':'bad'):'');r.fb.textContent=r.st.placed.length?(g?'✓ Correct':'✗ Not quite. Try again.'):''});return ok},
  show(){rows.forEach(r=>{const used=[];r.st.placed=r.it.a.split(' ').map(w=>{const k=r.it.w.findIndex((x,j)=>x===w&&!used.includes(j));used.push(k);return k});r.rend()})},
  reset(){rows.forEach(r=>{r.st.placed=[];r.fb.textContent='';r.rend()})}};
}

/* ---------- extra engines ---------- */
function both(b,fs){const ps=fs.map(f=>{const d=$('div');d.style.marginBottom='14px';b.appendChild(d);return f(d)});
 return{max:ps.reduce((s,p)=>s+p.max,0),check(){return ps.reduce((s,p)=>s+p.check(),0)},show(){ps.forEach(p=>p.show())},reset(){ps.forEach(p=>p.reset())}}}
function cloze(b,paras,G,mode){
 const gs=[];
 paras.forEach(p=>{const d=$('p','cl');
  p.split(/\{(\d+)\}/).forEach((s,k)=>{
   if(k%2===0){d.insertAdjacentHTML('beforeend',s);return}
   const n=+s,g=G[n];let c;
   if(mode==='sel'){c=$('select','gs');c.appendChild(new Option('— choose —',''));g.o.forEach((o,i)=>c.appendChild(new Option(LET[i]+') '+o,LET[i])))}
   else{c=$('input');c.type='text';c.autocomplete='off';c.spellcheck=false;c.setAttribute('autocapitalize','off');c.style.width='8.5em'}
   c.setAttribute('aria-label','gap '+n);
   if(g.ex){c.value=g.ex;c.disabled=true;c.classList.add('exg')}else gs.push([c,g]);
   d.appendChild(c);d.insertAdjacentHTML('beforeend','<sup>'+n+'</sup>')});
  b.appendChild(d)});
 const okv=(c,g)=>mode==='sel'?c.value===g.a:g.a.some(a=>N(a)===N(c.value));
 return{max:gs.length,
  check(){let ok=0;gs.forEach(([c,g])=>{c.classList.remove('ok','bad');if(!c.value.trim())return;const t=okv(c,g);if(t)ok++;c.classList.add(t?'ok':'bad')});return ok},
  show(){gs.forEach(([c,g])=>c.value=mode==='sel'?g.a:g.a[0])},
  reset(){gs.forEach(([c])=>{c.value='';c.classList.remove('ok','bad')})}};
}
function halves(b,c){
 const rows=[];
 c.L.forEach((t,i)=>{
  const r=$('div','q'),d=$('div');d.style.flex='1';d.insertAdjacentHTML('beforeend',t+' ');
  const s1=$('select','gs'),s2=$('select','gs');
  s1.appendChild(new Option('— linker —',''));c.lk.forEach(x=>s1.appendChild(new Option(x,x)));
  s2.appendChild(new Option('— choose the ending —',''));c.E.forEach((x,k)=>s2.appendChild(new Option(x,k)));
  s1.setAttribute('aria-label','linker '+(i+1));s2.setAttribute('aria-label','ending '+(i+1));
  const fb=$('span','fb');d.append(s1,$('span',null,' '),s2,fb);r.append($('span','n',i+1),d);b.appendChild(r);
  const row={s1,s2,fb,k:c.key[i]};
  if(i===c.ex){s1.value=row.k[0];s2.value=row.k[1];s1.disabled=s2.disabled=true;r.classList.add('ex')}else rows.push(row)});
 return{max:rows.length,
  check(){let ok=0;rows.forEach(r=>{[r.s1,r.s2].forEach(s=>s.classList.remove('ok','bad'));if(!r.s1.value&&!r.s2.value){r.fb.textContent='';return}
    const a=r.s1.value===r.k[0],e=r.s2.value!==''&&+r.s2.value===r.k[1];
    if(r.s1.value)r.s1.classList.add(a?'ok':'bad');if(r.s2.value)r.s2.classList.add(e?'ok':'bad');
    if(a&&e){ok++;r.fb.className='fb ok';r.fb.textContent=' ✓'}else{r.fb.className='fb bad';r.fb.textContent=' ✗ Check the linker and the ending.'}});return ok},
  show(){rows.forEach(r=>{r.s1.value=r.k[0];r.s2.value=r.k[1]})},
  reset(){rows.forEach(r=>{r.s1.value=r.s2.value='';[r.s1,r.s2].forEach(s=>s.classList.remove('ok','bad'));r.fb.textContent=''})}};
}
function cross(b,T,keep,okmsg){
 const on=T.map(()=>0),fb=$('p','fb'),bs=T.map((t,k)=>{const x=$('button','cx',LET[k]+') '+t);x.type='button';
  x.onclick=()=>{on[k]^=1;x.classList.toggle('on',!!on[k]);fb.textContent='';bs.forEach(y=>y.classList.remove('ok','bad'))};b.appendChild(x);return x});
 b.appendChild(fb);
 const set=v=>v.forEach((z,k)=>{on[k]=z;bs[k].classList.toggle('on',!!z);bs[k].classList.remove('ok','bad')});
 return{max:1,check(){const g=on.every((z,k)=>k===keep?!z:!!z);bs.forEach((x,k)=>{x.classList.remove('ok','bad');if(on[k])x.classList.add(k===keep?'bad':'ok')});
  fb.className='fb '+(g?'ok':'bad');fb.textContent=g?'✓ Correct: '+okmsg:'✗ Not quite. Cross out the TWO explanations which are not correct.';return g?1:0},
  show(){set(T.map((_,k)=>k===keep?0:1))},reset(){set(T.map(()=>0));fb.textContent=''}};
}
function lines(b,pre,L,post){
 b.appendChild($('p','cl',pre));const rows=[];
 L.forEach((l,i)=>{
  const r=$('div','q ln'),t=$('span','lt',l.t),c=$('span','lc'),x=$('input'),tk=$('button','opt','✓');
  x.type='text';x.placeholder='extra word';x.autocomplete='off';x.spellcheck=false;x.setAttribute('autocapitalize','off');x.setAttribute('aria-label','line '+(i+1));
  tk.type='button';tk.setAttribute('aria-label','line '+(i+1)+' is correct');
  const st={tick:false};
  const sync=()=>tk.classList.toggle('sel',st.tick);
  x.oninput=()=>{if(x.value.trim())st.tick=false;sync()};
