<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Starter — Welcome back!</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--teal:#028090;--navy:#0D2B35;--bg:#f2f7f8;--card:#fff;--text:#1d2b30;--line:#d5e3e6;--ok:#1b7f4b;--okbg:#e5f5ec;--bad:#b3261e;--badbg:#fdeceb;--ex:#eef4f5;--pl:85%;--snake:#bfe6c9;--snk2:#7cc492}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1d23;--card:#112a32;--text:#e4eef0;--line:#24434d;--ok:#6fd49b;--okbg:#14382b;--bad:#ff8f88;--badbg:#401a18;--ex:#17333c;--teal:#2bb3c4;--pl:30%;--snake:#1f4a33;--snk2:#2f6b48}}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 60px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Calibri,'Open Sans',sans-serif;font-size:18px;line-height:1.65;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
header{background:var(--navy);color:#fff;padding:26px 16px}
header h1{font-family:'Trebuchet MS',sans-serif;margin:0 auto;max-width:820px;font-size:1.8rem}
header p{max-width:820px;margin:4px auto 0;opacity:.85}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:2px solid var(--teal);padding:8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.score{font-family:'Trebuchet MS',sans-serif;font-weight:700;color:var(--teal);margin-right:auto}
.ctl{font:inherit;font-size:.88rem;border:0;border-radius:6px;padding:6px 13px;cursor:pointer;background:var(--teal);color:#fff}
.ctl.alt{background:transparent;color:var(--teal);border:1.5px solid var(--teal)}
main{max-width:820px;margin:0 auto;padding:10px 14px 50px}
.grp{font-family:'Trebuchet MS',sans-serif;color:var(--navy);margin:30px 0 10px;font-size:1.2rem;text-transform:uppercase;letter-spacing:.06em;border-bottom:2px solid var(--line)}
@media (prefers-color-scheme:dark){.grp{color:var(--text)}}
.card{background:var(--card);border-left:6px solid var(--teal);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.1);padding:16px 18px;margin-bottom:18px}
.sh{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.sh h2{font-size:1.05rem;margin:0;font-weight:700}
.badge{flex:none;background:var(--teal);color:#fff;font-family:'Trebuchet MS',sans-serif;font-weight:700;border-radius:50%;width:28px;height:28px;text-align:center;line-height:28px}
.sc{margin-left:auto;font-weight:700;color:var(--teal);white-space:nowrap}
.cr{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.q{display:flex;gap:10px;margin-bottom:12px}
.q .n{font-family:'Trebuchet MS',sans-serif;font-weight:700;color:var(--teal);min-width:1.4em}
.q.ex{background:var(--ex);border-radius:8px;padding:8px 10px}
.exw{color:var(--teal);border-bottom:2px solid var(--teal);font-style:italic;padding:0 4px}
input[type=text]{font:inherit;padding:2px 8px;border:0;border-bottom:2px solid var(--teal);background:var(--ex);color:var(--text);border-radius:4px 4px 0 0;max-width:100%;width:7em;text-align:center}
input.ph{width:10em}input.num{width:2.6em;font-weight:700;font-size:1.25rem;padding:0 2px;background:rgba(255,255,255,.85);color:#0D2B35;border-radius:6px}
input:focus{outline:2px solid var(--teal)}
input.ok{background:var(--okbg);color:var(--ok);border-color:var(--ok)}input.bad{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
.fb{display:block;font-size:.92rem;margin:4px 0 0;min-height:1.2em}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.opt{font:inherit;font-size:.95rem;padding:2px 13px;border:2px solid var(--line);border-radius:18px;background:var(--card);color:var(--text);cursor:pointer}
.opt:hover{border-color:var(--teal)}.opt.sel{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal);font-weight:700}
.opt.ok{background:var(--okbg);color:var(--ok);border-color:var(--ok)}.opt.bad{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
.wb{display:flex;flex-wrap:wrap;gap:4px 18px;border:1.5px solid var(--teal);border-radius:8px;padding:5px 14px;margin:0 0 14px;width:fit-content;max-width:100%}
.wb span{cursor:pointer;user-select:none}.wb span.used{text-decoration:line-through;opacity:.55}
.hint{margin:0 0 10px;font-size:.92rem;opacity:.88}
.pic{background:#fff;border-radius:8px;display:block;max-width:100%;height:auto}
/* Lesson 1 Ex 1 */
.person{display:flex;gap:16px;align-items:center;margin-bottom:14px;padding:8px;border-radius:10px}
.person .pic{width:96px;flex:none;border:1px solid var(--line)}
.person .ln{margin:2px 0}.person input[type=text]{width:5.6em}.pn{font-family:'Trebuchet MS',sans-serif;font-weight:700;color:var(--teal);margin-right:4px}
/* word search + snake */
.wwrap{overflow-x:auto;padding:6px 2px;-webkit-overflow-scrolling:touch}
.cell{font:inherit;font-weight:700;color:var(--text);border:0;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none}
.cell.star{color:#8a9aa0;cursor:default;font-weight:400}
.wgrid{display:grid;gap:3px;max-width:430px;margin:0 auto}
.wgrid .cell{aspect-ratio:1/1;border:1px solid var(--line);background:var(--card);border-radius:5px;font-size:1.15rem}
.cell.f{background:hsl(var(--h) 60% var(--pl));box-shadow:inset 0 0 0 2px hsl(var(--h) 55% 42%)}
.cell.s{box-shadow:0 0 0 3px var(--teal);background:var(--ex)}
.cell.x{background:var(--badbg)!important;color:var(--bad)}
.snake{display:flex;align-items:center;padding:24px 18px 24px 0;min-width:calc(33 * 19px + 90px)}
.snake .cell{flex:1 1 0;min-width:19px;height:38px;background:var(--snake);transform:translateY(var(--dy));font-size:1.12rem;font-weight:600;border-top:2px solid var(--snk2);border-bottom:2px solid var(--snk2)}
.snake .cell:first-child{border-radius:19px 0 0 19px;border-left:2px solid var(--snk2);flex-basis:8px;min-width:32px;justify-content:flex-end;padding-right:4px}
.swipe{display:none;font-size:.85rem;opacity:.75;margin:0}
.snake .cell.f{background:hsl(var(--h) 60% var(--pl))}
.shead{width:52px;height:46px;background:var(--snake);border:2px solid var(--snk2);border-radius:50% 60% 60% 50%;position:relative;transform:translateY(var(--dy));flex:none}
.shead:before{content:'';position:absolute;width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid #0D2B35;top:7px;right:12px}
.shead:after{content:'';position:absolute;width:5px;height:5px;border-radius:50%;background:#0D2B35;top:12px;right:16px}
.shead i{position:absolute;right:-14px;top:24px;width:16px;height:3px;background:#d33;border-radius:2px}
/* Lesson 2 */
.pers{display:grid;grid-template-columns:1fr 280px;gap:18px;align-items:start}
.pl{margin-bottom:12px}.pl .opts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.pg{display:inline-block;min-width:6em;border-bottom:2px solid var(--teal);text-align:center;color:var(--teal);font-weight:700;padding:0 6px}
.frame{border:10px solid #9fb7bd;border-radius:6px;background:#fff;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.frame canvas{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}
.pal{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}.sw.sel{box-shadow:0 0 0 3px var(--teal)}
.model{border:2px dashed var(--teal);border-radius:8px;padding:8px 12px;margin-top:10px;background:var(--ex)}
.strip{display:flex;gap:14px;justify-content:center;margin:0 0 14px;flex-wrap:wrap}
.strip figure{margin:0;text-align:center}.strip .pic{width:96px;height:104px;object-fit:contain;border:1px solid var(--line)}
.strip figcaption,.lt{font-family:'Trebuchet MS',sans-serif;font-weight:700;color:var(--teal)}
.slots,.pool{display:flex;flex-wrap:wrap;gap:6px;min-height:40px}
.slots{border-bottom:2px solid var(--teal);padding:2px 0 4px;margin:4px 0 6px}
.slots.ok{background:var(--okbg)}.slots.bad{background:var(--badbg)}
.tile{font:inherit;padding:2px 11px;border:2px solid var(--line);border-radius:8px;background:var(--ex);color:var(--text);cursor:pointer}
.tile:hover{border-color:var(--teal)}.tile.used{visibility:hidden}.tile.st{cursor:default}
.who{display:flex;gap:6px;align-items:center;margin-top:4px;flex-wrap:wrap}
.lb{font:inherit;font-weight:700;width:38px;height:38px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
.lb.sel{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal)}.lb.ok{background:var(--okbg);color:var(--ok);border-color:var(--ok)}.lb.bad{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
/* match (from Unit 2) */
.boxes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.list{display:flex;flex-direction:column;gap:7px}
.w{font:inherit;display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 10px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;min-height:44px;line-height:1.3}
.w:hover:not(:disabled){border-color:var(--teal)}
.w .lab{font-family:'Trebuchet MS',sans-serif;font-weight:700;color:var(--teal);min-width:1.1em}
.w .tx{flex:1}
.w.sel{border-color:var(--teal);box-shadow:0 0 0 3px rgba(2,128,144,.35);font-weight:600}
.w.pr{background:hsl(var(--h) 60% var(--pl));border-color:hsl(var(--h) 55% 45%)}
.w.ok{box-shadow:inset 0 0 0 2px var(--ok)}.w.bad{box-shadow:inset 0 0 0 2px var(--bad)}
.tag{font-family:'Trebuchet MS',sans-serif;font-size:.78rem;font-weight:700;min-width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;background:hsl(var(--h) 55% 38%);color:#fff}
/* Lesson 3 bubbles */
.scenes{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bub{border:2px solid var(--teal);border-radius:16px;padding:10px 14px;background:var(--card);position:relative;margin-bottom:16px;line-height:2}
.bub:after{content:'';position:absolute;bottom:-12px;left:50%;width:18px;height:18px;background:var(--card);border-right:2px solid var(--teal);border-bottom:2px solid var(--teal);transform:rotate(45deg)}
.scenes .pic{width:100%;border:1px solid var(--line)}
.today{margin-top:14px;font-size:1.05rem}
/* Lesson 4 */
.shop{width:100%;border:1px solid var(--line);margin-bottom:14px}
.cnt{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}
.balls{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px 8px}
.bl{text-align:center}.bl .bn{font-family:'Trebuchet MS',sans-serif;font-weight:700;color:var(--teal);font-size:.85rem}
.ball{width:84px;height:84px;margin:0 auto 6px;border-radius:50%;border:2.5px solid var(--navy);display:flex;align-items:center;justify-content:center;font-family:'Trebuchet MS',sans-serif;font-weight:700;font-size:1.6rem;color:#0D2B35}
.ball span{background:rgba(255,255,255,.85);border-radius:8px;padding:0 6px}
.k0{background:repeating-linear-gradient(45deg,#ffd27f 0 12px,#fff 12px 24px)}
.k1{background:radial-gradient(circle,#7fc8f8 4px,transparent 5px) 0 0/18px 18px,#fff}
.k2{background:linear-gradient(#ff9a9a 33%,#fff 33% 66%,#9ad79a 66%)}
.k3{background:conic-gradient(#b9a3ff 0 25%,#fff 0 50%,#b9a3ff 0 75%,#fff 0)}
.k4{background:radial-gradient(circle at 35% 35%,#fff 0 18%,#ffb3d1 19%)}
.bl input[type=text]{width:100%;max-width:6.4em}.bl .wd{display:block;min-height:1.7em}
.wd.exw{border:0;font-style:italic}
@media (max-width:640px){.pers{grid-template-columns:1fr}.pers .frame{max-width:300px}.balls{grid-template-columns:repeat(3,minmax(0,1fr))}.swipe{display:block}}
@media (max-width:520px){.card{padding:14px 11px}.boxes{gap:8px}.w{padding:5px 7px;font-size:.93rem}.cnt{grid-template-columns:1fr}.scenes{grid-template-columns:1fr}.person .pic{width:68px}.person{gap:10px;padding:4px 0}.ctl{padding:6px 9px}.score{width:100%;text-align:center;margin:0}}
</style></head><body>
<header><h1>Starter — Welcome back!</h1><p>Family and Friends 2 · Workbook · Lessons 1–4: names, looks, family, greetings, days of the week, toys and numbers 11–20. Do each exercise, then press <b>Check</b>. / Выполни каждое упражнение и нажми <b>Check</b>.</p></header>
<div class="bar"><span class="score" id="tot">Score: 0 / 0</span>
<button class="ctl" id="gc">Check All</button><button class="ctl alt" id="gs">Show Answers</button><button class="ctl alt" id="gr">Reset All</button></div>
<main id="main"></main>

const $=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const N=s=>s.toLowerCase().replace(/[’‘`]/g,"'").replace(/[.!?,]+/g,' ').replace(/\s+/g,' ').trim();
const LET='abcdefghij',HUE=[190,28,285,140,340,55,220];
const S=[];const sec=(g,l,i,b)=>S.push({g,l,i,b});
const img=(k,c)=>'<img class="'+(c||'pic')+'" src="'+IMG[k]+'" alt="">';

/* ---------- word box (tap to cross out) ---------- */
function wbox(body,words,struck){const d=$('div','wb'),m={};
 words.forEach(w=>{const s=$('span',struck.includes(w)?'used':'',w);if(!struck.includes(w))s.onclick=()=>s.classList.toggle('used');m[w]=s;d.appendChild(s)});
 body.appendChild(d);return m}

/* ---------- gap engine ---------- */
function Gaps(){const G=[];
 return{
  add(a,o={}){const x=$('input',o.cls||'');x.type='text';x.autocomplete='off';x.spellcheck=false;x.setAttribute('autocapitalize','off');x.setAttribute('autocorrect','off');
   if(o.num)x.inputMode='numeric';x.setAttribute('aria-label',o.label||'answer');
   const g={x,a:a.map(N),show:o.show||a[0],ok:o.ok};G.push(g);x.addEventListener('input',()=>x.classList.remove('ok','bad'));return x},
  eng(fb){return{max:G.length,
   check(){let ok=0,any=0;G.forEach(g=>{const v=N(g.x.value);g.x.classList.remove('ok','bad');if(!v)return;any++;const r=g.ok?g.ok(v):g.a.includes(v);g.x.classList.add(r?'ok':'bad');if(r)ok++});
    if(fb){fb.className='fb '+(ok===G.length?'ok':any?'bad':'');fb.textContent=any?(ok===G.length?'✓ All correct!':ok+' of '+G.length+' correct. Look at the red ones again.'):''}return ok},
   show(){G.forEach(g=>{g.x.value=typeof g.show==='function'?g.show():g.show})},
   reset(){G.forEach(g=>{g.x.value='';g.x.classList.remove('ok','bad')});if(fb){fb.textContent='';fb.className='fb'}}}}}}
function both(b,fs){const ps=fs.map(f=>{const d=$('div');b.appendChild(d);return f(d)});
 return{max:ps.reduce((s,p)=>s+p.max,0),check(){return ps.reduce((s,p)=>s+p.check(),0)},show(){ps.forEach(p=>p.show())},reset(){ps.forEach(p=>p.reset())}}}

/* ---------- word finder (snake + grid) ---------- */
function finder(body,c){
 const R=c.rows.map(r=>r.split('')),H=R.length,W=R[0].length,pos={};
 c.words.forEach(w=>{const lw=w.toLowerCase();let f=null;
  for(let y=0;y<H&&!f;y++)for(let x=0;x<W&&!f;x++)[[1,0],[0,1]].forEach(([dx,dy])=>{if(f)return;let s='';const cs=[];
   for(let k=0;k<lw.length;k++){const X=x+dx*k,Y=y+dy*k;if(X>=W||Y>=H)return;s+=R[Y][X];cs.push(Y*W+X)}
   if(s.toLowerCase()===lw)f=cs});
  if(!f)console.error('Word not in grid: '+w);pos[w]=f||[]});
 const g=$('div',c.snake?'snake':'wgrid');if(!c.snake)g.style.gridTemplateColumns='repeat('+W+',1fr)';
 const cells=[];
 R.forEach((row,y)=>row.forEach((ch,x)=>{const i=y*W+x;
  if(ch==='*'){const s=$('span','cell star','★');g.appendChild(s);cells.push(s);return}
  const b=$('button','cell',ch);b.type='button';b.setAttribute('aria-label','letter '+ch);b.onclick=()=>tap(i);
  if(c.snake)b.style.setProperty('--dy',(Math.sin(i*.42)*13).toFixed(1)+'px');
  g.appendChild(b);cells.push(b)}));
 if(c.snake){const hd=$('span','shead','<i></i>');hd.style.setProperty('--dy',(Math.sin(W*.42)*13-6).toFixed(1)+'px');g.appendChild(hd)}
 const wrap=$('div','wwrap');wrap.appendChild(g);body.appendChild(wrap);if(c.snake)body.insertBefore($('p','swipe','↔ Swipe the snake sideways to see all the letters. / Листай змейку в сторону, чтобы увидеть все буквы.'),wrap);
 const fb=$('p','fb');body.appendChild(fb);
 let found=new Set(c.ex?[c.ex]:[]),start=null,tm;
 function paint(){cells.forEach(e=>{e.classList.remove('f','s');e.style.removeProperty('--h')});
  c.words.forEach((w,k)=>{if(found.has(w))pos[w].forEach(i=>{cells[i].classList.add('f');cells[i].style.setProperty('--h',HUE[k%7])})});
  if(start!=null)cells[start].classList.add('s');
  if(c.box)c.words.forEach(w=>{if(c.box[w])c.box[w].classList.toggle('used',found.has(w))})}
 const key=ix=>ix.slice().sort((p,q)=>p-q).join(',');
 function tap(i){fb.textContent='';fb.className='fb';
  if(start==null){start=i;paint();return}
  if(start===i){start=null;paint();return}
  const a=start;start=null;const ya=Math.floor(a/W),xa=a%W,yb=Math.floor(i/W),xb=i%W,idx=[];
  if(ya===yb){const d=xb>xa?1:-1;for(let x=xa;x!==xb+d;x+=d)idx.push(ya*W+x)}
  else if(xa===xb){const d=yb>ya?1:-1;for(let y=ya;y!==yb+d;y+=d)idx.push(y*W+xa)}
  const hit=idx.length?c.words.find(w=>!found.has(w)&&key(pos[w])===key(idx)):null;
  paint();
  if(hit){found.add(hit);paint();fb.className='fb ok';fb.textContent='✓ '+hit+'!'}
  else{const bad=idx.length?idx:[a,i];bad.forEach(k=>cells[k].classList.add('x'));fb.className='fb bad';
   fb.textContent=idx.length?'✗ That is not a word from the box. Try again.':'✗ Words go in a straight line. Tap the first letter, then the last letter.';
   clearTimeout(tm);tm=setTimeout(()=>cells.forEach(e=>e.classList.remove('x')),900)}}
 paint();
 const items=c.words.filter(w=>w!==c.ex);
 return{max:items.length,
  check(){const n=items.filter(w=>found.has(w)).length;fb.className='fb '+(n===items.length?'ok':'bad');fb.textContent=n===items.length?'✓ You found them all!':n+' of '+items.length+' found. Keep looking!';return n},
  show(){c.words.forEach(w=>found.add(w));start=null;paint()},
  reset(){found=new Set(c.ex?[c.ex]:[]);start=null;fb.textContent='';fb.className='fb';paint()}}}

/* ---------- match (from Unit 2) ---------- */
function match(body,c){
 let pairs={},sel=null,chk=false;if(c.ex!=null)pairs[c.ex]=c.key[c.ex];
 const wrap=$('div','boxes'),LA=$('div','list'),LB=$('div','list'),fb=$('p','fb');wrap.append(LA,LB);body.append(wrap,fb);
 const left=r=>Object.keys(pairs).find(k=>pairs[k]===r);
 const H=i=>HUE[i%6];
 function btn(side,i){const L=side==='L';const pi=L?(i in pairs?pairs[i]:null):(left(i)!=null?+left(i):null);
  const b=$('button','w');b.type='button';b.innerHTML='<span class="lab">'+(L?i+1:LET[i])+'</span><span class="tx">'+(L?c.L[i]:c.R[i])+'</span>';
  const li=L?i:pi;
  if(pi!=null){b.classList.add('pr');b.style.setProperty('--h',H(li));b.insertAdjacentHTML('beforeend','<span class="tag">'+(L?LET[pi]:+pi+1)+'</span>');
   if(chk&&li!==c.ex)b.classList.add(c.key[li]===pairs[li]?'ok':'bad')}
  if(L&&sel===i)b.classList.add('sel');
  if(li===c.ex&&pi!=null)b.disabled=true;
  b.onclick=()=>{chk=false;fb.textContent='';
   if(L){if(sel===i)sel=null;else{delete pairs[i];sel=i}}
   else{const o=left(i);if(sel!=null){if(o!=null)delete pairs[o];pairs[sel]=i;sel=null}else if(o!=null)delete pairs[o]}
   rend()};return b}
 function rend(){LA.innerHTML='';LB.innerHTML='';c.L.forEach((_,i)=>LA.appendChild(btn('L',i)));c.R.forEach((_,i)=>LB.appendChild(btn('R',i)))}
 rend();
 return{max:c.L.length-(c.ex!=null?1:0),
  check(){chk=true;let ok=0,t=0;c.L.forEach((_,i)=>{if(i===c.ex||!(i in pairs))return;t++;if(pairs[i]===c.key[i])ok++});rend();
   fb.className='fb '+(t&&ok===t?'ok':'bad');fb.textContent=t?ok+' of '+t+' pairs correct'+(t<this.max?' ('+(this.max-t)+' still to match)':'')+'.':'';return ok},
  show(){pairs={};c.L.forEach((_,i)=>pairs[i]=c.key[i]);sel=null;rend()},
  reset(){pairs={};if(c.ex!=null)pairs[c.ex]=c.key[c.ex];sel=null;chk=false;fb.textContent='';rend()}}}

/* ---------- reorder + who is it? ---------- */
function orderWho(body,items){
 const rows=[];
 items.forEach(it=>{
  const r=$('div','q'+(it.ex?' ex':'')),d=$('div');d.style.flex='1';r.append($('span','n',it.n),d);body.appendChild(r);
  if(it.ex){d.innerHTML='<div class="pool">'+it.w.map(w=>'<span class="tile st">'+w+'</span>').join('')+'</div><div style="margin-top:6px"><b class="exw">'+it.ex+'</b> → <span class="lb ok" style="display:inline-flex;align-items:center;justify-content:center">'+it.p+'</span></div>';return}
  const slots=$('div','slots'),pool=$('div','pool'),who=$('div','who'),fb=$('span','fb');
  who.appendChild($('span',null,'Who is it? / Кто это?'));
  const st={placed:[],p:null,chk:false},lbs=[];
  ['a','b','c'].forEach(l=>{const b=$('button','lb',l);b.type='button';b.onclick=()=>{st.p=l;st.chk=false;fb.textContent='';paint()};lbs.push(b);who.appendChild(b)});
  d.append(pool,slots,who,fb);
  function paint(){slots.innerHTML='';pool.innerHTML='';
   const s=st.placed.map(k=>it.w[k]).join(' '),g=it.a.includes(s);
   slots.className='slots'+(st.chk&&st.placed.length?(g?' ok':' bad'):'');
   st.placed.forEach(k=>{const b=$('button','tile',it.w[k]);b.type='button';b.onclick=()=>{st.placed=st.placed.filter(x=>x!==k);st.chk=false;fb.textContent='';paint()};slots.appendChild(b)});
   it.w.forEach((w,k)=>{const b=$('button','tile'+(st.placed.includes(k)?' used':''),w);b.type='button';b.onclick=()=>{st.placed.push(k);st.chk=false;fb.textContent='';paint()};pool.appendChild(b)});
   lbs.forEach(b=>{b.className='lb';if(b.textContent===st.p)b.classList.add(st.chk?(st.p===it.p?'ok':'bad'):'sel')})}
  rows.push({it,st,paint,fb});paint()});
 const R=rows;
 return{max:R.length*2,
  check(){let ok=0;R.forEach(r=>{r.st.chk=true;const s=r.st.placed.map(k=>r.it.w[k]).join(' ');const a=r.it.a.includes(s),b=r.st.p===r.it.p;if(a)ok++;if(b)ok++;r.paint();
   const any=r.st.placed.length||r.st.p;r.fb.className='fb '+(any?(a&&b?'ok':'bad'):'');
   r.fb.textContent=!any?'':a&&b?'✓ Correct':(!a&&r.st.placed.length?'✗ Check the word order. ':'')+(!b&&r.st.p?'✗ Look at the pictures again.':'')+(!r.st.p?' Choose a, b or c.':'')+(!r.st.placed.length?' Put the words in order.':'')});return ok},
  show(){R.forEach(r=>{const used=[];r.st.placed=r.it.a[0].split(' ').map(w=>{const k=r.it.w.findIndex((x,j)=>x===w&&!used.includes(j));used.push(k);return k});r.st.p=r.it.p;r.st.chk=false;r.paint()})},
  reset(){R.forEach(r=>{r.st.placed=[];r.st.p=null;r.st.chk=false;r.fb.textContent='';r.fb.className='fb';r.paint()})}}}

function aboutMe(body){
 const lay=$('div','pers'),L=$('div'),Rt=$('div');lay.append(L,Rt);body.appendChild(lay);
 const nm=$('input','ph');nm.type='text';nm.autocomplete='off';nm.setAttribute('aria-label','your name');
 const P=[{t:"I'm [].",o:['six','seven','eight']},{t:"I've got [] hair.",o:['blond','brown','black','red']},{t:"I've got [] hair.",o:['long','short']},{t:"I've got [] hair.",o:['straight','curly']},{t:"I've got [] eyes.",o:['brown','blue','grey','green']}];

 const st=P.map((p,i)=>{const d=$('div','pl'),g=$('span','pg','&nbsp;'),o=$('div','opts'),r={v:null,g,bs:[]};const pt=p.t.split('[]');
  d.append($('span','pn',String(i+2)),document.createTextNode(pt[0]),g,document.createTextNode(pt[1]));
  p.o.forEach(w=>{const b=$('button','opt',w);b.type='button';b.onclick=()=>{r.v=r.v===w?null:w;paint(r)};r.bs.push(b);o.appendChild(b)});
  d.appendChild(o);L.appendChild(d);return r});
 function paint(r){r.g.innerHTML=r.v||'&nbsp;';r.bs.forEach(b=>b.classList.toggle('sel',b.textContent===r.v))}
 /* drawing */
 const fr=$('div','frame'),cv=$('canvas');cv.width=520;cv.height=600;fr.appendChild(cv);Rt.append($('p','hint','<b>Draw yourself</b> in the frame. / <b>Нарисуй себя</b> в рамке.'),fr);
 const ctx=cv.getContext('2d');let col='#2b2b2b',drawing=false,pen=6;
 function guide(){ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.strokeStyle='#d6dde0';ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(260,250,120,150,0,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(60,600);ctx.quadraticCurveTo(80,450,210,420);ctx.moveTo(310,420);ctx.quadraticCurveTo(440,450,460,600);ctx.stroke()}
 guide();
 const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
 cv.addEventListener('pointerdown',e=>{drawing=true;cv.setPointerCapture(e.pointerId);const[x,y]=pt(e);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+.1,y+.1);ctx.strokeStyle=col;ctx.lineWidth=pen;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()});
 cv.addEventListener('pointermove',e=>{if(!drawing)return;const[x,y]=pt(e);ctx.lineTo(x,y);ctx.stroke()});
 ['pointerup','pointercancel','pointerleave'].forEach(t=>cv.addEventListener(t,()=>drawing=false));
 const pal=$('div','pal'),sws=[];
 ['#2b2b2b','#8b5a2b','#f2c14e','#e53935','#1e88e5','#43a047','#ec6fb0','#ffffff'].forEach((c,i)=>{const b=$('button','sw'+(i?'':' sel'));b.type='button';b.style.background=c;b.title=i===7?'eraser':c;
  b.onclick=()=>{col=c;pen=i===7?22:6;sws.forEach(s=>s.classList.remove('sel'));b.classList.add('sel')};sws.push(b);pal.appendChild(b)});
 const clr=$('button','ctl alt','Clear');clr.type='button';clr.onclick=guide;pal.appendChild(clr);Rt.appendChild(pal);
 const fb=$('p','fb'),model=$('div','model','<b>Example answer</b> (yours will be different):<br>My name\'s Anna. I\'m eight. I\'ve got blond hair. I\'ve got long hair. I\'ve got straight hair. I\'ve got blue eyes.');model.hidden=true;
 body.append(fb,model);
 return{max:0,
  check(){const miss=(nm.value.trim()?0:1)+st.filter(r=>!r.v).length;fb.className='fb '+(miss?'bad':'ok');fb.textContent=miss?'Finish all six sentences ('+miss+' still empty).':'✓ Well done! Now read your sentences aloud.';return 0},
  show(){model.hidden=false},
  reset(){nm.value='';st.forEach(r=>{r.v=null;paint(r)});fb.textContent='';fb.className='fb';model.hidden=true;guide()}}}
