 if(!info[key]){d.className='empty';grid.appendChild(d);continue}
 d.className='cell';if(D.nums[key]){const i=document.createElement('i');i.textContent=D.nums[key];d.appendChild(i)}
 const inp=document.createElement('input');inp.maxLength=2;inp.autocomplete='off';inp.setAttribute('aria-label','cell');d.appendChild(inp);grid.appendChild(d);inputs[key]=inp;inp.parentNode.key=key;
 inp.onmousedown=()=>{prev=cur};
 inp.onfocus=()=>{cur=key;if(info[key][dir]===undefined)dir=dir=='a'?'d':'a';hl()};
 inp.onclick=()=>{if(prev===key&&info[key].a!==undefined&&info[key].d!==undefined)dir=dir=='a'?'d':'a';hl()};
 inp.oninput=()=>{const v=inp.value.replace(/[^a-z]/gi,'').slice(-1).toUpperCase();inp.value=v;clr1(inp);if(v)step(1)};
 inp.onkeydown=e=>{const[r,c]=key.split(',').map(Number);let m=null;
  if(e.key=='Backspace'&&!inp.value){e.preventDefault();const p=step(-1);if(p)p.value='';return}
  if(e.key=='ArrowRight'){m=[0,1];dir='a'}else if(e.key=='ArrowLeft'){m=[0,-1];dir='a'}else if(e.key=='ArrowDown'){m=[1,0];dir='d'}else if(e.key=='ArrowUp'){m=[-1,0];dir='d'}
  if(m){e.preventDefault();const k=(r+m[0])+','+(c+m[1]);if(inputs[k])inputs[k].focus();else hl()}}}
function cellsOf(k){const w=D.words[k],a=[];for(let i=0;i<w.w.length;i++)a.push((w.r+(w.d=='d'?i:0))+','+(w.c+(w.d=='a'?i:0)));return a}
function hl(){document.querySelectorAll('.hl').forEach(x=>x.classList.remove('hl'));document.querySelectorAll('.clue.on').forEach(x=>x.classList.remove('on'));
 if(!cur)return;const k=info[cur][dir];if(k===undefined)return;cellsOf(k).forEach(x=>inputs[x].parentNode.classList.add('hl'));const el=document.getElementById('cl'+k);if(el)el.classList.add('on')}
function clr1(i){i.parentNode.classList.remove('ok','bad')}
D.words.forEach((w,k)=>{const el=document.createElement('div');el.className='clue';el.id='cl'+k;
 el.innerHTML=`<b>${w.n} ${w.d=='a'?'→':'↓'}</b>${SV[w.i]}<p>${DF[w.i]}</p><button class="tr" type="button" aria-pressed="false" title="Перевод на русский" aria-label="Show Russian translation">${FLAG}RU</button><p class="ru" lang="ru">${DR[w.i]}</p><small>${w.w.length} letters${TWO.includes(w.i)?' · 2 words':''}</small>`;
 el.onclick=()=>{dir=w.d;inputs[w.r+','+w.c].focus();cur=w.r+','+w.c;hl()};const tb=el.querySelector('.tr');tb.onclick=e=>{e.stopPropagation();const on=el.classList.toggle('tr-on');tb.setAttribute('aria-pressed',on)};document.getElementById(w.d=='a'?'ca':'cd').appendChild(el)});
const msg=document.getElementById('msg'),hb=document.getElementById('hint');HMAX=Math.floor(Object.keys(inputs).length*0.2);
function hbUpd(){const l=HMAX-hintsUsed;hb.innerHTML='💡 Hint<span class="hc">'+l+'</span>';hb.disabled=l<=0;hb.title=l+' hints left'}hbUpd();
document.getElementById('chk').onclick=()=>{let all=true,n=0;for(const k in inputs){const i=inputs[k],p=i.parentNode;p.classList.remove('ok','bad');if(!i.value){all=false;continue}if(i.readOnly){n++;continue}
 if(i.value.toUpperCase()==info[k].ch){p.classList.add('ok');n++}else{p.classList.add('bad');all=false}}
 const h=hintsUsed?' Hints used: '+hintsUsed+' of '+HMAX+'.':'';msg.textContent=(all?'🎉 Perfect! All words are correct.':n+' of '+Object.keys(inputs).length+' letters are correct.')+h};
hb.onclick=()=>{if(hintsUsed>=HMAX){msg.textContent='No hints left.';return}const k=cur?info[cur][dir]:undefined;
 if(k===undefined){msg.textContent='Click a word in the grid first, then press Hint.';return}
 const cs=cellsOf(k),t=cs.find(x=>inputs[x].value.toUpperCase()!=info[x].ch);
 if(!t){msg.textContent='This word is already complete.';return}
 const i=inputs[t];i.value=info[t].ch;i.readOnly=true;clr1(i);i.parentNode.classList.add('hint');hintsUsed++;hbUpd();
 const nx=cs.slice(cs.indexOf(t)+1).find(x=>!inputs[x].readOnly);cur=nx||t;(nx?inputs[nx]:i).focus();hl();
 msg.textContent='Hint: letter '+(cs.indexOf(t)+1)+' of '+cs.length+'.'+(hintsUsed>=HMAX?' That was your last hint.':'')};
document.getElementById('clr').onclick=()=>{for(const k in inputs){inputs[k].value='';inputs[k].readOnly=false;clr1(inputs[k]);inputs[k].parentNode.classList.remove('hint')}msg.textContent=''};
</script></body></html>
