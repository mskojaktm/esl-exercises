<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Classroom Word Search</title>
<style>
body{font-family:system-ui,Arial,sans-serif;margin:0;padding:16px;background:#f6f7fb;color:#1f2937}
h1{font-size:1.5rem;text-align:center;margin:4px 0}.sub{text-align:center;color:#475569;margin:0 0 14px}
.wrap{max-width:1150px;margin:auto;display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:flex-start}
#gw{position:relative;user-select:none;-webkit-user-select:none;touch-action:none}
#ws{display:grid;gap:4px;position:relative;z-index:2}
.c{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;background:#fff;border:2px solid #cbd5e1;border-radius:6px;cursor:pointer;box-sizing:border-box;color:#1f2937}
.c.sel{background:#fde68a;border-color:#f59e0b}.c.start{background:#fde68a;border-color:#f59e0b;box-shadow:0 0 0 2px #f59e0b inset}
.c.bad{background:#fbd0d0;border-color:#ef4444}.c.hint{box-shadow:0 0 0 3px #2563eb inset;color:#1d4ed8}
#ov{position:absolute;inset:0;z-index:3;pointer-events:none}
.cap{position:absolute;border-radius:22px;border:3px solid;box-sizing:border-box}
.btns{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;padding:8px 14px;border-radius:8px;border:2px solid #334155;background:#fff;color:#1f2937;cursor:pointer}button:hover{background:#e2e8f0}
button:disabled{opacity:.5;cursor:not-allowed;background:#fff}
.hc{display:inline-block;min-width:1.5em;margin-left:6px;padding:0 6px;border-radius:999px;background:#2563eb;color:#fff;font-weight:700;font-size:.9em}button:disabled .hc{background:#94a3b8}
#lives{margin-top:10px;font-size:20px;letter-spacing:2px;min-height:1.4em}#lives .lt{font-size:15px;font-weight:700;color:#475569;letter-spacing:0;margin-right:6px}#lives .off{filter:grayscale(1);opacity:.35}
#msg{margin-top:10px;font-weight:700;min-height:1.4em;max-width:380px}
.pics{flex:1;min-width:300px;max-width:600px;display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.pc{background:#fff;border:2px solid #cbd5e1;border-radius:12px;padding:6px;text-align:center;cursor:pointer;position:relative}
.pc svg{width:110px;height:101px}.pc.on{border-color:#f59e0b;background:#fffbeb}
.pc.done{border-color:#16a34a;background:#f0fdf4;cursor:default}
.pc .wd{display:block;height:1.3em;font-weight:700;letter-spacing:2px;color:#15803d;font-size:16px}
.pc .tk{position:absolute;top:4px;right:8px;color:#16a34a;font-weight:700;font-size:18px;display:none}.pc.done .tk{display:block}
</style></head><body>
<h1>Classroom Word Search</h1>
<p class="sub">Find the words for the pictures. Words go → , ← or ↓.</p>
<div class="wrap">
<div><div id="gw"><div id="ws"></div><div id="ov"></div></div>
<div class="btns"><button id="hint"></button><button id="rst">Start again</button></div>
<div id="lives"></div><div id="msg"></div></div>
<div class="pics" id="pics"></div>
</div>
<script>
const G=["JWWYVYXYQFFV", "XVWWYELBATJY", "JPENCILCASEK", "KFJVLJJCYYVY", "YJXWAYBOARDV", "ZVVXSJWMXYKX", "QXYYSVXPXPVZ", "YXXKRVJUZEQX", "QQYYOYYTZGZW", "QKXYOVZEHVFK", "HFZFMQZRKHYJ", "QKKFWFFVVJKF"],W=[{"w": "classroom", "cells": [[2, 4], [3, 4], [4, 4], [5, 4], [6, 4], [7, 4], [8, 4], [9, 4], [10, 4]]}, {"w": "table", "cells": [[1, 9], [1, 8], [1, 7], [1, 6], [1, 5]]}, {"w": "computer", "cells": [[3, 7], [4, 7], [5, 7], [6, 7], [7, 7], [8, 7], [9, 7], [10, 7]]}, {"w": "peg", "cells": [[6, 9], [7, 9], [8, 9]]}, {"w": "pencil case", "cells": [[2, 1], [2, 2], [2, 3], [2, 4], [2, 5], [2, 6], [2, 7], [2, 8], [2, 9], [2, 10]]}, {"w": "board", "cells": [[4, 6], [4, 7], [4, 8], [4, 9], [4, 10]]}],SV=["<svg viewBox=\"0 0 100 92\" aria-hidden=\"true\"><rect x=\"0\" y=\"0\" width=\"100\" height=\"62\" fill=\"#fef3c7\"/><rect x=\"0\" y=\"62\" width=\"100\" height=\"30\" fill=\"#d6a76c\"/><rect x=\"8\" y=\"8\" width=\"40\" height=\"24\" rx=\"2\" fill=\"#166534\" stroke=\"#92400e\" stroke-width=\"3\"/><path d=\"M14,16 h10 M14,22 h16 M32,14 l6,6 M38,14 l-6,6\" stroke=\"#f8fafc\" stroke-width=\"1.5\"/><rect x=\"62\" y=\"8\" width=\"26\" height=\"22\" fill=\"#bae6fd\" stroke=\"#f8fafc\" stroke-width=\"3\"/><path d=\"M75,8 V30 M62,19 H88\" stroke=\"#f8fafc\" stroke-width=\"2\"/><circle cx=\"55\" cy=\"14\" r=\"5\" fill=\"#fff\" stroke=\"#475569\" stroke-width=\"1.5\"/><path d=\"M55,11 V14 H57\" stroke=\"#475569\" stroke-width=\"1.2\" fill=\"none\"/><g id=\"dk\"><rect x=\"6\" y=\"50\" width=\"22\" height=\"5\" fill=\"#b45309\"/><rect x=\"8\" y=\"55\" width=\"3\" height=\"11\" fill=\"#78350f\"/><rect x=\"23\" y=\"55\" width=\"3\" height=\"11\" fill=\"#78350f\"/><rect x=\"12\" y=\"58\" width=\"10\" height=\"3\" fill=\"#2563eb\"/><rect x=\"12\" y=\"45\" width=\"2.5\" height=\"21\" fill=\"#2563eb\"/></g><use href=\"#dk\" x=\"33\"/><use href=\"#dk\" x=\"66\"/><g transform=\"translate(16,20)\"><use href=\"#dk\" x=\"0\"/><use href=\"#dk\" x=\"33\"/></g></svg>", "<svg viewBox=\"0 0 100 92\" aria-hidden=\"true\"><line x1=\"0\" y1=\"84\" x2=\"100\" y2=\"84\" stroke=\"#cbd5e1\" stroke-width=\"3\"/><polygon points=\"14,40 86,40 96,50 4,50\" fill=\"#d97706\"/><rect x=\"4\" y=\"50\" width=\"92\" height=\"7\" fill=\"#b45309\"/><rect x=\"10\" y=\"57\" width=\"6\" height=\"27\" fill=\"#92400e\"/><rect x=\"84\" y=\"57\" width=\"6\" height=\"27\" fill=\"#92400e\"/><rect x=\"22\" y=\"50\" width=\"5\" height=\"26\" fill=\"#78350f\"/><rect x=\"73\" y=\"50\" width=\"5\" height=\"26\" fill=\"#78350f\"/></svg>", "<svg viewBox=\"0 0 100 92\" aria-hidden=\"true\"><rect x=\"16\" y=\"6\" width=\"62\" height=\"44\" rx=\"4\" fill=\"#334155\"/><rect x=\"21\" y=\"11\" width=\"52\" height=\"34\" fill=\"#38bdf8\"/><path d=\"M21,45 L38,28 L50,38 L60,30 L73,45 Z\" fill=\"#22c55e\"/><circle cx=\"62\" cy=\"19\" r=\"4\" fill=\"#fde047\"/><rect x=\"42\" y=\"50\" width=\"10\" height=\"10\" fill=\"#475569\"/><rect x=\"32\" y=\"60\" width=\"30\" height=\"4\" rx=\"2\" fill=\"#475569\"/><rect x=\"10\" y=\"70\" width=\"64\" height=\"14\" rx=\"3\" fill=\"#cbd5e1\" stroke=\"#64748b\" stroke-width=\"1.5\"/><g fill=\"#64748b\"><rect x=\"14\" y=\"73\" width=\"6\" height=\"3\"/><rect x=\"22\" y=\"73\" width=\"6\" height=\"3\"/><rect x=\"30\" y=\"73\" width=\"6\" height=\"3\"/><rect x=\"38\" y=\"73\" width=\"6\" height=\"3\"/><rect x=\"46\" y=\"73\" width=\"6\" height=\"3\"/><rect x=\"54\" y=\"73\" width=\"6\" height=\"3\"/><rect x=\"62\" y=\"73\" width=\"8\" height=\"3\"/><rect x=\"24\" y=\"78\" width=\"36\" height=\"3\"/></g><ellipse cx=\"86\" cy=\"77\" rx=\"6\" ry=\"8\" fill=\"#cbd5e1\" stroke=\"#64748b\" stroke-width=\"1.5\"/><path d=\"M86,69 V75 M86,69 Q86,62 78,60\" stroke=\"#64748b\" stroke-width=\"1.5\" fill=\"none\"/></svg>", "<svg viewBox=\"0 0 100 92\" aria-hidden=\"true\"><rect x=\"0\" y=\"0\" width=\"100\" height=\"92\" fill=\"#f1f5f9\"/><rect x=\"4\" y=\"14\" width=\"92\" height=\"12\" rx=\"2\" fill=\"#b45309\"/><g fill=\"#475569\"><circle cx=\"20\" cy=\"20\" r=\"4\"/><circle cx=\"50\" cy=\"20\" r=\"4\"/><circle cx=\"80\" cy=\"20\" r=\"4\"/></g><path d=\"M20,20 v10 q0,6 6,4 M50,20 v10 q0,6 6,4\" stroke=\"#475569\" stroke-width=\"3.5\" fill=\"none\" stroke-linecap=\"round\"/><path d=\"M80,20 v10\" stroke=\"#475569\" stroke-width=\"3.5\" stroke-linecap=\"round\"/><path d=\"M80,30 l-6,4 -4,48 h20 l-4,-48 Z\" fill=\"#ef4444\"/><path d=\"M74,34 l-14,8 2,22 8,-2 M86,34 l14,8 -2,22 -8,-2\" fill=\"#dc2626\"/><path d=\"M80,30 v52\" stroke=\"#991b1b\" stroke-width=\"1.5\"/><circle cx=\"80\" cy=\"30\" r=\"5\" fill=\"none\" stroke=\"#475569\" stroke-width=\"3\"/><circle cx=\"20\" cy=\"36\" r=\"9\" fill=\"none\" stroke=\"#f59e0b\" stroke-width=\"2.5\" stroke-dasharray=\"3 2\"/><circle cx=\"50\" cy=\"36\" r=\"9\" fill=\"none\" stroke=\"#f59e0b\" stroke-width=\"2.5\" stroke-dasharray=\"3 2\"/></svg>", "<svg viewBox=\"0 0 100 92\" aria-hidden=\"true\"><g transform=\"rotate(-20 40 40)\"><rect x=\"34\" y=\"8\" width=\"7\" height=\"40\" fill=\"#facc15\"/><polygon points=\"34,8 41,8 37.5,0\" fill=\"#fcd9b6\"/><polygon points=\"36,3 39,3 37.5,0\" fill=\"#111\"/></g><g transform=\"rotate(10 55 40)\"><rect x=\"50\" y=\"6\" width=\"7\" height=\"42\" fill=\"#3b82f6\"/><polygon points=\"50,6 57,6 53.5,-2\" fill=\"#fcd9b6\"/><polygon points=\"52,1 55,1 53.5,-2\" fill=\"#1e3a8a\"/></g><g transform=\"rotate(28 66 44)\"><rect x=\"62\" y=\"14\" width=\"7\" height=\"34\" fill=\"#22c55e\"/><polygon points=\"62,14 69,14 65.5,6\" fill=\"#fcd9b6\"/><polygon points=\"64,9 67,9 65.5,6\" fill=\"#14532d\"/></g><path d=\"M8,42 Q8,36 14,36 H86 Q92,36 92,42 V78 Q92,86 84,86 H16 Q8,86 8,78 Z\" fill=\"#a855f7\"/><path d=\"M10,42 H90\" stroke=\"#6b21a8\" stroke-width=\"3\" stroke-dasharray=\"3 2\"/><rect x=\"72\" y=\"38\" width=\"8\" height=\"10\" rx=\"2\" fill=\"#e5e7eb\" stroke=\"#6b7280\"/><circle cx=\"76\" cy=\"54\" r=\"3\" fill=\"none\" stroke=\"#6b7280\" stroke-width=\"2\"/><path d=\"M14,52 h4 M26,62 h4 M40,54 h4 M54,66 h4 M22,74 h4 M66,72 h4\" stroke=\"#d8b4fe\" stroke-width=\"3\" stroke-linecap=\"round\"/></svg>", "<svg viewBox=\"0 0 100 92\" aria-hidden=\"true\"><rect x=\"4\" y=\"8\" width=\"92\" height=\"62\" rx=\"3\" fill=\"#92400e\"/><rect x=\"9\" y=\"13\" width=\"82\" height=\"52\" fill=\"#166534\"/><circle cx=\"26\" cy=\"30\" r=\"7\" fill=\"none\" stroke=\"#f8fafc\" stroke-width=\"2\"/><path d=\"M26,18 v4 M26,38 v4 M14,30 h4 M34,30 h4 M18,22 l3,3 M34,22 l-3,3 M18,38 l3,-3 M34,38 l-3,-3\" stroke=\"#f8fafc\" stroke-width=\"1.8\"/><text x=\"48\" y=\"36\" font-family=\"Arial\" font-size=\"15\" font-weight=\"700\" fill=\"#f8fafc\">2+3</text><path d=\"M16,54 q10,-8 20,0 t20,0 t20,0\" stroke=\"#fde047\" stroke-width=\"2\" fill=\"none\"/><rect x=\"4\" y=\"70\" width=\"92\" height=\"6\" rx=\"2\" fill=\"#b45309\"/><rect x=\"20\" y=\"66\" width=\"10\" height=\"4\" rx=\"1\" fill=\"#fff\"/><rect x=\"64\" y=\"65\" width=\"14\" height=\"5\" rx=\"1\" fill=\"#475569\"/><rect x=\"64\" y=\"65\" width=\"14\" height=\"2\" fill=\"#f59e0b\"/><path d=\"M14,76 V88 M86,76 V88\" stroke=\"#78350f\" stroke-width=\"4\"/></svg>"],N=G.length,PITCH=48,COLS=['#ef4444','#f59e0b','#22c55e','#06b6d4','#8b5cf6','#ec4899','#14b8a6','#f97316','#84cc16','#6366f1','#e11d48','#0ea5e9'];
const ws=document.getElementById('ws'),ov=document.getElementById('ov'),msg=document.getElementById('msg'),hb=document.getElementById('hint');
ws.style.gridTemplateColumns=`repeat(${N},44px)`;
const cellEl={};
for(let r=0;r<N;r++)for(let c=0;c<N;c++){const d=document.createElement('div');d.className='c';d.textContent=G[r][c];d.dataset.r=r;d.dataset.c=c;ws.appendChild(d);cellEl[r+','+c]=d}
const key=a=>a.map(x=>x[0]+','+x[1]).sort().join('|');
W.forEach(w=>w.k=key(w.cells));
const found=new Set(),hinted={};let sel=null,start=null,drag=false,last=null,hintsUsed=0,miss=0,over=false;const TMAX=Math.round(W.length*0.66);
const lv=document.getElementById('lives');function lvUpd(){let h='<span class="lt">Tries:</span>';for(let k=0;k<TMAX;k++)h+='<span'+(k<TMAX-miss?'':' class="off"')+'>❤️</span>';lv.innerHTML=h}lvUpd();
const HMAX=5;
function hbUpd(){const l=HMAX-hintsUsed;hb.innerHTML='💡 Hint<span class="hc">'+l+'</span>';hb.disabled=l<=0}hbUpd();
// picture cards (shuffled order so they don't follow the grid)
const order=W.map((_,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
order.forEach(i=>{const el=document.createElement('div');el.className='pc';el.id='pc'+i;
 el.innerHTML=`<span class="tk">✓</span>${SV[i]}<span class="wd"></span>`;
 el.onclick=()=>{if(over||found.has(i))return;sel=sel===i?null:i;document.querySelectorAll('.pc.on').forEach(x=>x.classList.remove('on'));if(sel!==null)el.classList.add('on')};
 document.getElementById('pics').appendChild(el)});
function cellOf(t){const d=t&&t.closest?t.closest('.c'):null;return d?[+d.dataset.r,+d.dataset.c]:null}
function line(a,b){const out=[];if(a[0]===b[0]){const s=Math.sign(b[1]-a[1]);for(let c=a[1];;c+=s){out.push([a[0],c]);if(c===b[1])break}}
 else if(a[1]===b[1]){const s=Math.sign(b[0]-a[0]);for(let r=a[0];;r+=s){out.push([r,a[1]]);if(r===b[0])break}}else return null;return out}
function clearSel(){document.querySelectorAll('.c.sel,.c.start').forEach(x=>x.classList.remove('sel','start'))}
function preview(a,b){clearSel();const l=line(a,b);if(l)l.forEach(x=>cellEl[x[0]+','+x[1]].classList.add('sel'));else cellEl[a[0]+','+a[1]].classList.add('sel')}
function cap(i){const cs=W[i].cells,r0=Math.min(...cs.map(x=>x[0])),r1=Math.max(...cs.map(x=>x[0])),c0=Math.min(...cs.map(x=>x[1])),c1=Math.max(...cs.map(x=>x[1]));
 const d=document.createElement('div');d.className='cap';const col=COLS[i%COLS.length];
 Object.assign(d.style,{left:(c0*PITCH-2)+'px',top:(r0*PITCH-2)+'px',width:((c1-c0)*PITCH+48)+'px',height:((r1-r0)*PITCH+48)+'px',borderColor:col,background:col+'33'});ov.appendChild(d)}
function finish(a,b){clearSel();const l=line(a,b);
 if(l&&l.length>1&&l[1][0]<l[0][0]){flash(l);msg.textContent='Words go → , ← or ↓ (not up).';return}
 if(!l||l.length<2){flash(l||[a]);msg.textContent='Choose letters in one straight line: → , ← or ↓.';return}
 const k=key(l),i=W.findIndex(w=>w.k===k);
 if(i<0){flash(l);miss++;lvUpd();const left=TMAX-miss;
 if(left<=0){over=true;hb.disabled=true;sel=null;document.querySelectorAll('.pc.on').forEach(x=>x.classList.remove('on'));msg.textContent='No more tries! You found '+found.size+' of '+W.length+' words. Press “Start again” to play again.';return}
 msg.textContent='Not a word from the pictures. Try again! ('+left+(left===1?' try':' tries')+' left)';return}
 if(found.has(i)){msg.textContent='You already found this word.';return}
 found.add(i);cap(i);const el=document.getElementById('pc'+i);el.classList.add('done');el.classList.remove('on');el.querySelector('.wd').textContent=W[i].w.toUpperCase();
 if(sel===i)sel=null;
 const h=hintsUsed?' Hints used: '+hintsUsed+' of '+HMAX+'.':'';
 msg.textContent=(found.size===W.length?'🎉 Well done! You found all '+W.length+' words.':'Great! Found '+found.size+' of '+W.length+'.')+h}
function flash(l){l.forEach(x=>{const e=cellEl[x[0]+','+x[1]];e.classList.add('bad');setTimeout(()=>e.classList.remove('bad'),600)})}
const same=(a,b)=>a&&b&&a[0]===b[0]&&a[1]===b[1];
ws.addEventListener('pointerdown',e=>{if(over)return;const c=cellOf(e.target);if(!c)return;e.preventDefault();
 if(start&&!drag&&!same(start,c)){const s=start;start=null;finish(s,c);return}
 start=c;last=c;drag=true;preview(c,c)});
window.addEventListener('pointermove',e=>{if(!drag)return;const c=cellOf(document.elementFromPoint(e.clientX,e.clientY));if(c){last=c;preview(start,c)}});
window.addEventListener('pointerup',()=>{if(!drag)return;drag=false;
 if(same(start,last)){clearSel();cellEl[start[0]+','+start[1]].classList.add('start');msg.textContent='Now click the last letter of the word.';return}
 const s=start;start=null;finish(s,last)});
hb.onclick=()=>{if(over)return;if(hintsUsed>=HMAX){msg.textContent='No hints left.';return}
 if(sel===null){msg.textContent='Click a picture first, then press Hint.';return}
 const w=W[sel],n=hinted[sel]||0;
 if(n>=w.cells.length){msg.textContent='All the letters of this word are already shown.';return}
 const x=w.cells[n];cellEl[x[0]+','+x[1]].classList.add('hint');hinted[sel]=n+1;hintsUsed++;hbUpd();
 msg.textContent='Hint: letter '+(n+1)+' of '+w.cells.length+' is marked in blue.'+(hintsUsed>=HMAX?' That was your last hint.':'')};
document.getElementById('rst').onclick=()=>{found.clear();miss=0;over=false;lvUpd();hbUpd();ov.innerHTML='';start=null;sel=null;clearSel();
 for(const k in hinted)delete hinted[k];document.querySelectorAll('.c.hint').forEach(x=>x.classList.remove('hint'));
 document.querySelectorAll('.pc').forEach(x=>{x.classList.remove('done','on');x.querySelector('.wd').textContent=''});msg.textContent=''};
</script></body></html>
