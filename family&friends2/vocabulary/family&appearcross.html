<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Family &amp; Appearance Crossword</title>
<style>
body{font-family:system-ui,Arial,sans-serif;margin:0;padding:16px;background:#f6f7fb;color:#1f2937}
h1{font-size:1.5rem;text-align:center;margin:4px 0}.sub{text-align:center;color:#475569;margin:0 0 14px}
.wrap{max-width:1250px;margin:auto;display:flex;flex-wrap:wrap;gap:22px;justify-content:center;align-items:flex-start}
#gb{overflow-x:auto;max-width:100%;padding:4px}#grid{display:grid;gap:2px}
.cell,.empty{width:38px;height:38px;position:relative}
.cell input{width:100%;height:100%;box-sizing:border-box;text-align:center;font-size:20px;font-weight:700;text-transform:uppercase;border:2px solid #334155;border-radius:4px;padding:0;background:#fff;color:#1f2937;caret-color:transparent;font-family:inherit}
.cell.hl input{background:#fff3c4}.cell.hint input{background:#dbeafe;color:#1d4ed8;border-color:#3b82f6}.cell.ok input{background:#c9f2d3}.cell.bad input{background:#fbd0d0}
.cell i{position:absolute;top:1px;left:3px;font-size:10px;font-style:normal;font-weight:700;color:#475569;pointer-events:none;z-index:1}
.btns{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
button:disabled{opacity:.5;cursor:not-allowed;background:#fff}.hc{display:inline-block;min-width:1.5em;margin-left:6px;padding:0 6px;border-radius:999px;background:#2563eb;color:#fff;font-weight:700;font-size:.9em}button:disabled .hc{background:#94a3b8}
button{font:inherit;padding:8px 14px;border-radius:8px;border:2px solid #334155;background:#fff;color:#1f2937;cursor:pointer}button:hover{background:#e2e8f0}
#msg{margin-top:10px;font-weight:700;min-height:1.4em}
.clues{flex:1;min-width:300px;max-width:600px}.clues h2{font-size:1.05rem;margin:4px 0 8px}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-bottom:14px}
.clue{background:#fff;border:2px solid #cbd5e1;border-radius:10px;padding:6px 8px;text-align:center;cursor:pointer;color:#1f2937}
.clue.on{border-color:#f59e0b;background:#fffbeb}.clue svg{width:124px;height:112px}
.clue b{display:block;font-size:14px}.clue p{margin:2px 0 4px;font-size:13px;line-height:1.3}.clue small{color:#64748b;font-size:11px}
</style></head><body>
<h1>Family &amp; Appearance Crossword</h1>
<p class="sub">Read each clue, look at the picture and write the word in the grid.</p>
<div class="wrap">
<div><div id="gb"><div id="grid"></div></div>
<div class="btns"><button id="chk">Check</button><button id="hint">💡 Hint</button><button id="clr">Clear</button></div><div id="msg"></div></div>
<div class="clues"><h2>Across →</h2><div class="cg" id="ca"></div><h2>Down ↓</h2><div class="cg" id="cd"></div></div>
</div>
