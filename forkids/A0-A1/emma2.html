<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emma's Ranch Revision – A1 – 45 minutes</title>
<style>
:root{--navy:#0D2B35;--teal:#028090;--gold:#E0A526;--sand:#F7F0DC;--ok:#2E8B57;--bad:#C0392B}
*{box-sizing:border-box}
body{margin:0;background:var(--sand);color:var(--navy);font:18px/1.45 Calibri,Arial,sans-serif}
h1,h2{font-family:"Trebuchet MS",Arial,sans-serif;margin:0}
header{background:var(--navy);color:#fff;padding:22px 16px 18px;text-align:center;border-bottom:6px solid var(--gold)}
header h1{font-size:30px;color:var(--gold)}
header p{margin:6px 0 0;opacity:.9}
#bar{position:sticky;top:0;z-index:5;background:var(--teal);color:#fff;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:8px 10px;font-weight:bold}
#bar button{font:inherit;border:0;border-radius:8px;padding:7px 14px;cursor:pointer;background:var(--gold);color:var(--navy)}
#bar button.g{background:#fff}
#prog{flex:1 1 140px;max-width:260px;height:12px;background:#ffffff55;border-radius:6px;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
main{max-width:780px;margin:0 auto;padding:14px}
section{background:#fff;border-left:8px solid var(--teal);border-radius:10px;box-shadow:0 3px 8px #0d2b3522;padding:14px 16px;margin:16px 0}
section h2{font-size:22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{background:var(--gold);border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-size:18px}
.min{margin-left:auto;font-size:14px;background:var(--navy);color:#fff;border-radius:12px;padding:2px 10px}
.hint{margin:4px 0 10px;color:#3d5a64}
.story{background:var(--sand);border-radius:8px;padding:10px 14px;margin:8px 0;font-size:19px}
.item{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:9px 0;border-top:1px dashed #cfc7aa}
.q{font-size:22px;min-width:180px;flex:1 1 220px}
.q.big{font-size:28px}
.q svg{width:90px;height:90px;vertical-align:middle}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.tok{font:inherit;border:2px solid var(--teal);background:#fff;color:var(--navy);border-radius:10px;padding:6px 14px;cursor:pointer}
.opts button.on,.tok.pick{background:var(--teal);color:#fff}
input.t{font:inherit;font-size:22px;width:170px;padding:6px 10px;border:2px solid var(--teal);border-radius:10px}
.build{flex:1 1 100%}
.slot{min-height:48px;border:2px dashed var(--teal);border-radius:10px;padding:6px;margin-bottom:8px;display:flex;flex-wrap:wrap;gap:6px}
.fb{font-weight:bold;min-width:90px}
.item.ok{background:#e6f5ec}.item.ok .fb{color:var(--ok)}
.item.no{background:#fbe9e6}.item.no .fb{color:var(--bad)}
.say label{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px dashed #cfc7aa;font-size:20px}
.say input{width:24px;height:24px}
#final{display:none;text-align:center;font-size:24px;font-family:"Trebuchet MS",Arial,sans-serif;background:var(--navy);color:var(--gold);border-radius:12px;padding:18px;margin:16px 0}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<header><h1>🤠 Emma's Ranch Revision</h1><p>11 stations · 45 minutes · Read, choose, write and speak!</p></header>
<div id="bar">
  <span>⭐ <span id="sc">0</span>/<span id="tot">0</span></span>
  <div id="prog"><i></i></div>
  <button onclick="check()">Check answers</button>
  <button class="g" onclick="show()">Show answers</button>
  <button class="g" onclick="reset()">Reset</button>
</div>
<main id="main"></main>
<div id="final"></div>
<script>
const clock=(h,m)=>{let t='';for(let i=0;i<12;i++){const a=i*30*Math.PI/180;t+=`<line x1="${50+40*Math.sin(a)}" y1="${50-40*Math.cos(a)}" x2="${50+45*Math.sin(a)}" y2="${50-45*Math.cos(a)}" stroke="#0D2B35" stroke-width="3"/>`}
const a=(h%12*30+m/2)*Math.PI/180,b=m*6*Math.PI/180;
return `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="#fff" stroke="#E0A526" stroke-width="5"/>${t}<line x1="50" y1="50" x2="${50+38*Math.sin(b)}" y2="${50-38*Math.cos(b)}" stroke="#028090" stroke-width="4" stroke-linecap="round"/><line x1="50" y1="50" x2="${50+25*Math.sin(a)}" y2="${50-25*Math.cos(a)}" stroke="#0D2B35" stroke-width="6" stroke-linecap="round"/><circle cx="50" cy="50" r="4" fill="#E0A526"/></svg>`};
const ct=(h,m)=>m?`It's half past ${h}`:`It's ${h} o'clock`;
const clk=[[3,0],[7,30],[10,0],[12,30],[5,30]].map(([h,m])=>[clock(h,m),[ct(h,m),ct(h,m?0:30),ct(h%12+1,m)],ct(h,m)]);
const S=[
{e:'🔤',t:'Spelling',m:5,h:'Look at the picture. Write the word.',k:'type',
 i:[['🐑','sheep'],['🍎','apple'],['🌵','cactus'],['🥾','boots'],['💧','water']]},
{e:'🔢',t:'One or many? (plurals)',m:3,h:'Choose the right word.',k:'choice',
 i:[['1 horse, 3 …',['horses','horse','horsees'],'horses'],['1 box, 2 …',['boxs','boxes','boxies'],'boxes'],['1 baby, 4 …',['babys','babyes','babies'],'babies'],['1 child, 5 …',['childs','children','childrens'],'children']]},
{e:'👤',t:'I am / You are / She is',m:3,h:'Choose am, is or are.',k:'choice',
 i:[['I ___ ten years old.',['am','is','are'],'am'],['Tom ___ my friend.',['am','is','are'],'is'],['We ___ on a ranch.',['am','is','are'],'are'],['My cows ___ big.',['is','are','am'],'are'],['___ you a cowboy?',['Are','Is','Am'],'Are']]},
{e:'🐴',t:'Have got',m:3,h:'Choose have got or has got.',k:'choice',
 i:[['I ___ a horse.',['have got','has got'],'have got'],['She ___ a red hat.',['have got','has got'],'has got'],['They ___ two dogs.',['have got','has got'],'have got'],['Sam ___ a big farm.',['has got','have got'],'has got']]},
{e:'🍎',t:'Likes and dislikes',m:4,h:'Choose the right word.',k:'choice',
 i:[['I ___ apples. 😋',['like','likes','am like'],'like'],['He ___ milk. 🥛',['like','likes','liking'],'likes'],['She doesn\'t ___ fish. 🐟',['likes','like','liking'],'like'],['We ___ carrots. 🥕 (No!)',['don\'t like','doesn\'t like','not like'],'don\'t like'],['My horse ___ apples. 🐴',['likes','like','are like'],'likes']]},
{e:'📦',t:'Where is it? (in, on, under)',m:3,h:'Choose the right word.',k:'choice',
 i:[['The cat is ___ the box. 🐱 (inside)',['in','on','under'],'in'],['The hat is ___ the table. 🎩 (on top)',['in','on','under'],'on'],['The dog is ___ the chair. 🐶 (below)',['in','on','under'],'under'],['The birds are ___ the tree. 🐦 (on a branch)',['in','on','under'],'in']]},
{e:'💪',t:'Can and can\'t',m:3,h:'Choose the right word.',k:'choice',
 i:[['A fish ___ swim. 🐟',['can','can\'t','cans'],'can'],['A horse ___ fly. 🐴',['can','can\'t','flies'],'can\'t'],['___ you ride a horse?',['Can','Do','Are'],'Can'],['I can ___ a song. 🎵',['sings','sing','singing'],'sing']]},
{e:'⏰',t:'What time is it?',m:5,h:'Look at the clock. Choose the time.',k:'clock',i:clk},
{e:'📖',t:'Read and answer',m:5,k:'choice',
 h:'Read the text. Then choose <b>True</b> or <b>False</b>.<div class="story">Hi! I\'m Sam. I\'m twelve. I live on a ranch with my mum, my dad and my sister. We have got four horses and six cows. My horse is called Star. She\'s brown and white. I ride her every day at half past seven, before school. Star likes apples, but she doesn\'t like carrots.</div>',
 i:[['Sam is ten.',['True','False'],'False'],['Sam has got a sister.',['True','False'],'True'],['The family has got six horses.',['True','False'],'False'],['Sam rides Star at 7:30.',['True','False'],'True'],['Star likes carrots.',['True','False'],'False']]},
{e:'🧩',t:'Build the sentence',m:7,h:'Tap the words in the right order. Big letter at the start. Dot or question mark at the end.',k:'order',
 i:[['What is your name?'],['I can ride a horse.'],['She has got a red hat.'],['There are three cows.'],['Where do you live?']]},
{e:'🎤',t:'Speak to the teacher',m:4,h:'Say it aloud. Tick ✔ when you did it.',k:'say',
 i:[['Tell me about your family (two sentences).'],['What do you like? What don\'t you like?'],['Ask me: “Can you ride a horse?”'],['Describe your favourite animal: colour, size, what it can do.']]}
];
const main=document.getElementById('main');let sel={},graded=[];
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
function build(){main.innerHTML='';graded=[];sel={};
S.forEach((s,si)=>{const sec=document.createElement('section');
 sec.innerHTML=`<h2><span class="badge">${s.e}</span>${si+1}. ${s.t}<span class="min">${s.m} min</span></h2><p class="hint">${s.h}</p>`;
 s.i.forEach((it,ii)=>{const id=si+'_'+ii;const d=document.createElement('div');d.className='item';d.id='it'+id;
  if(s.k=='say'){d.className='say';d.innerHTML=`<label><input type="checkbox"> ${it[0]}</label>`;sec.appendChild(d);return}
  graded.push({id,s:s.k,it});
  if(s.k=='type'){d.innerHTML=`<div class="q big">${it[0]}</div><input class="t" id="in${id}" autocomplete="off" autocapitalize="off" spellcheck="false"><span class="fb"></span>`}
  else if(s.k=='order'){const w=shuf(it[0].split(' '));d.innerHTML=`<div class="build"><div class="slot" id="sl${id}"></div><div class="opts" id="pl${id}"></div></div><span class="fb"></span>`;
    const pl=d.querySelector('.opts'),sl=d.querySelector('.slot');w.forEach(x=>{const b=document.createElement('button');b.className='tok';b.textContent=x;b.onclick=()=>{if(b.parentNode==pl){sl.appendChild(b);b.classList.add('pick')}else{pl.appendChild(b);b.classList.remove('pick')}upd()};pl.appendChild(b)})}
  else{d.innerHTML=`<div class="q">${it[0]}</div><div class="opts">${shuf(it[1]).map(o=>`<button data-v="${o.replace(/"/g,'&quot;')}">${o}</button>`).join('')}</div><span class="fb"></span>`;
    d.querySelectorAll('button').forEach(b=>b.onclick=()=>{d.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');sel[id]=b.dataset.v;upd()})}
  sec.appendChild(d)});main.appendChild(sec)});
 document.getElementById('tot').textContent=graded.length;upd()}
function val(g){if(g.s=='type')return document.getElementById('in'+g.id).value.trim().toLowerCase();
 if(g.s=='order')return [...document.getElementById('sl'+g.id).children].map(b=>b.textContent).join(' ');
 return sel[g.id]||''}
const ans=g=>g.s=='type'?g.it[1]:g.s=='order'?g.it[0]:g.it[2];
function upd(){const n=graded.filter(g=>val(g)).length;document.querySelector('#prog i').style.width=(n/graded.length*100)+'%'}
function check(){let ok=0;graded.forEach(g=>{const v=val(g),c=g.s=='order'?v==ans(g):v.toLowerCase()==ans(g).toLowerCase();
 const d=document.getElementById('it'+g.id);d.className='item '+(c?'ok':'no');d.querySelector('.fb').textContent=c?'✓ Great!':(v?'✗ Try again':'✗ Answer me!');if(c)ok++});
 document.getElementById('sc').textContent=ok;const f=document.getElementById('final');f.style.display='block';
 f.textContent=ok==graded.length?'🏆 Perfect, cowgirl Emma! Yeehaw!':ok>=graded.length*.75?'🤠 Very good! Fix the red ones.':'🐴 Good try! Look at the red ones and try again.'}
function show(){graded.forEach(g=>{const a=ans(g);
 if(g.s=='type')document.getElementById('in'+g.id).value=a;
 else if(g.s=='order'){const d=document.getElementById('it'+g.id),pl=d.querySelector('.opts'),sl=d.querySelector('.slot');[...sl.children].forEach(b=>{pl.appendChild(b);b.classList.remove('pick')});
   a.split(' ').forEach(w=>{const b=[...pl.children].find(x=>x.textContent==w);if(b){b.classList.add('pick');sl.appendChild(b)}})}
 else{sel[g.id]=a;document.querySelectorAll('#it'+g.id+' button').forEach(b=>b.classList.toggle('on',b.dataset.v==a))}});upd();check()}
function reset(){build();document.getElementById('sc').textContent=0;document.getElementById('final').style.display='none';scrollTo(0,0)}
build();
</script>
</body>
</html>
